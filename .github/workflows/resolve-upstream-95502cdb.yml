name: Resolve upstream 95502cdb conflict

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/resolve-upstream-95502cdb.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: windows-2022
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Merge and resolve exact upstream conflict
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch upstream master.' }

          $expectedUpstream = '95502cdb92ad3f4b3842acc4f0d8f58aeb799f3c'
          $upstreamSha = (git rev-parse upstream/master).Trim()
          if ($upstreamSha -ne $expectedUpstream) {
            throw "Upstream moved from expected $expectedUpstream to $upstreamSha; refusing stale automatic resolution."
          }

          git merge --no-ff --no-commit upstream/master
          if ($LASTEXITCODE -eq 0) {
            throw 'Expected the known DX11VideoProcessor.cpp conflict, but merge completed cleanly; refusing unexpected state.'
          }

          $conflicts = @(git diff --name-only --diff-filter=U)
          if ($conflicts.Count -ne 1 -or $conflicts[0] -ne 'Source/DX11VideoProcessor.cpp') {
            git merge --abort
            throw "Unexpected conflict set: $($conflicts -join ', ')"
          }

          git checkout --ours -- Source/DX11VideoProcessor.cpp
          $path = 'Source/DX11VideoProcessor.cpp'
          $text = [IO.File]::ReadAllText($path)
          $old = @'
	auto superRes = (m_bVPScaling && m_iMaxineOperation == MAXINE_OPERATION_Disabled && m_InternalTexFmt == DXGI_FORMAT_B8G8R8A8_UNORM && (params.CDepth == 8 || !m_bACMEnabled))
		? m_iVPSuperRes : SUPERRES_Disable;
	m_bVPUseSuperRes = (m_D3D11VP.SetSuperRes(superRes) == S_OK);

	auto rtxHDR = m_bVPRTXVideoHDR && m_bHdrPassthroughSupport && m_bHdrPassthrough && m_iTexFormat != TEXFMT_8INT && !SourceIsHDR();
	m_bVPUseRTXVideoHDR = (m_D3D11VP.SetRTXVideoHDR(rtxHDR) == S_OK);
'@
          $new = @'
	auto rtxHDR = m_bVPRTXVideoHDR && m_bHdrPassthroughSupport && m_bHdrPassthrough && m_iTexFormat != TEXFMT_8INT && !SourceIsHDR();
	m_bVPUseRTXVideoHDR = (m_D3D11VP.SetRTXVideoHDR(rtxHDR) == S_OK);

	auto superRes = (m_bVPScaling && m_iMaxineOperation == MAXINE_OPERATION_Disabled
			&& (m_InternalTexFmt == DXGI_FORMAT_B8G8R8A8_UNORM || m_bVPUseRTXVideoHDR)
			&& (params.CDepth == 8 || !m_bACMEnabled)) ? m_iVPSuperRes : SUPERRES_Disable;
	m_bVPUseSuperRes = (m_D3D11VP.SetSuperRes(superRes) == S_OK);
'@
          if (-not $text.Contains($old)) {
            git merge --abort
            throw 'Known fork-side Super Resolution/RTX HDR block was not found exactly once; refusing unsafe edit.'
          }
          $resolved = $text.Replace($old, $new)
          if ($resolved -eq $text) {
            git merge --abort
            throw 'Resolution produced no source change.'
          }
          [IO.File]::WriteAllText($path, $resolved, [Text.UTF8Encoding]::new($false))
          git add Source/DX11VideoProcessor.cpp

          $remaining = @(git diff --name-only --diff-filter=U)
          if ($remaining.Count -ne 0) {
            git merge --abort
            throw "Unresolved conflicts remain: $($remaining -join ', ')"
          }

          git commit -m 'Merge Aleksoid1978/VideoRenderer upstream master (95502cdb)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit resolved upstream merge.' }

          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodules.' }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not update submodules.' }

      - name: Build resolved merge
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { throw "Resolved upstream merge failed to build with exit code $LASTEXITCODE." }

      - name: Push verified merge
        shell: pwsh
        run: |
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { throw 'Could not push verified merge; master may have moved.' }

      - name: Dispatch rolling build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref master --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Resolved merge was pushed, but rolling build dispatch failed.' }

# One-off trigger commit after workflow registration.
