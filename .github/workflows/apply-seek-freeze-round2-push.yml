name: Apply NvOFFRUC seek-freeze follow-up push

on:
  push:
    branches: [fix/nvoffruc-seek-freeze]

permissions:
  contents: write

jobs:
  apply:
    if: hashFiles('.github/seek-freeze-round2.patch.gz.b64') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/nvoffruc-seek-freeze
          fetch-depth: 0

      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/seek-freeze-round2.patch.gz.b64 | gzip -d > /tmp/seek-freeze-round2.patch
          echo 'd868e150f3d55eab1271f24f3bd50c6635c2042bd3bbde21f1872738ec147fe0  /tmp/seek-freeze-round2.patch' | sha256sum -c -
          git apply --check /tmp/seek-freeze-round2.patch
          git apply /tmp/seek-freeze-round2.patch
          rm -f .github/seek-freeze-round2.patch.gz.b64
          rm -f .github/seek-freeze-round2.trigger
          rm -f .github/workflows/apply-seek-freeze-round2.yml
          rm -f .github/workflows/apply-seek-freeze-round2-push.yml

      - name: Commit follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: avoid interface-lock deadlock in FRUC receive path'
          git push origin HEAD:fix/nvoffruc-seek-freeze
