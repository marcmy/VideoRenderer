name: Apply Maxine panel source

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/apply-maxine-panel.yml
      - .tmp/maxine-panel.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/maxine-settings-panel'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/maxine-settings-panel
          fetch-depth: 0

      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail

          base64 -d .tmp/maxine-panel.patch.gz.b64 | gzip -dc > /tmp/maxine-panel.patch
          echo "f5702532fdae1eccd7780d9f18ba64e50bbc54d51b7fdeb62cea39efabe14eb4  /tmp/maxine-panel.patch" | sha256sum -c -

          for file in \
            DX11VideoProcessor.cpp \
            DX11VideoProcessor.h \
            IVideoRenderer.h \
            MpcVideoRenderer.rc \
            NvidiaMaxineVSR.cpp \
            NvidiaMaxineVSR.h \
            PropPage.cpp \
            PropPage.h \
            VideoRenderer.cpp \
            resource.h; do
            sed -i 's/\r$//' "Source/$file"
          done

          git apply --check /tmp/maxine-panel.patch
          git apply /tmp/maxine-panel.patch

      - name: Commit completed implementation
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .tmp
          rm -f tree-test.txt
          rm -f .github/workflows/apply-maxine-panel.yml
          rm -f .github/workflows/export-maxine-source.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: add dedicated NVIDIA Maxine settings panel"
          git push origin HEAD:feature/maxine-settings-panel

      - name: Dispatch renderer build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref feature/maxine-settings-panel --repo "${GITHUB_REPOSITORY}"
