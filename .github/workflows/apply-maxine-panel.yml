name: Apply Maxine panel source

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/apply-maxine-panel.yml
      - .tmp/maxine-source.part*
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.head_ref == 'feature/maxine-settings-panel'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/maxine-settings-panel
          fetch-depth: 0

      - name: Reassemble staged source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/maxine-source.part00 \
            .tmp/maxine-source.part01 \
            .tmp/maxine-source.part02 \
            .tmp/maxine-source.part03 \
            .tmp/maxine-source.part04-05 \
            .tmp/maxine-source.part06-07 \
            .tmp/maxine-source.part08 \
            > maxine-panel-source-assembled.zip
          sha256sum maxine-panel-source-assembled.zip

      - name: Upload assembled archive for verification
        uses: actions/upload-artifact@v7
        with:
          name: maxine-panel-source-assembled
          path: maxine-panel-source-assembled.zip
          compression-level: 0

      - name: Validate and apply source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t maxine-panel-source-assembled.zip
          unzip -o maxine-panel-source-assembled.zip -d .
          rm -rf .tmp
          rm -f tree-test.txt
          rm -f maxine-panel-source-assembled.zip
          rm -f .github/workflows/apply-maxine-panel.yml
          rm -f .github/workflows/export-maxine-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: add dedicated NVIDIA Maxine settings panel"
          git push origin HEAD:feature/maxine-settings-panel

      - name: Dispatch renderer build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref feature/maxine-settings-panel --repo "${GITHUB_REPOSITORY}"
