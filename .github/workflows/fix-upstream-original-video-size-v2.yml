name: One-shot upstream originalVideoSize v2 fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-upstream-original-video-size-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Apply upstream originalVideoSize v2 representation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Source/VideoRenderer.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $pattern = '(?ms)\t} else if \(!strcmp\(field, "originalVideoSize"\)\) \{\r?\n\t\tlong width, height;\r?\n\t\tm_VideoProcessor->GetVideoSize\(width, height\);\r?\n\t\t\*value = \(static_cast<__int64>\(width\) << 32\) \| \(static_cast<__int64>\(height\) & 0xFFFFFFFF\);\r?\n\r?\n\t\treturn S_OK;\r?\n\t\}'
          $match = [regex]::Match($text, $pattern)
          if (-not $match.Success) {
            if ($text -match '(?ms)else if \(!strcmp\(field, "originalVideoSize"\)\).*?SIZE size;.*?static_assert\(sizeof\(\*value\) == sizeof\(size\)\);.*?\*value = \*\(__int64\*\)&size;') {
              Write-Host 'Upstream v2 originalVideoSize representation is already present.'
              exit 0
            }
            throw 'Could not locate the expected originalVideoSize implementation.'
          }

          $nl = if ($match.Value.Contains("`r`n")) { "`r`n" } else { "`n" }
          $replacement = "`t} else if (!strcmp(field, `"originalVideoSize`")) {$nl" +
                         "`t`tSIZE size;$nl" +
                         "`t`tm_VideoProcessor->GetVideoSize(size.cx, size.cy);$nl$nl" +
                         "`t`tstatic_assert(sizeof(*value) == sizeof(size));$nl" +
                         "`t`t*value = *(__int64*)&size;$nl$nl" +
                         "`t`treturn S_OK;$nl" +
                         "`t}"

          $text = $text.Substring(0, $match.Index) + $replacement + $text.Substring($match.Index + $match.Length)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Build patched source
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) {
            throw "Patched source failed to build with exit code $LASTEXITCODE."
          }

      - name: Commit verified patch and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/fix-upstream-original-video-size-v2.yml
          git add Source/VideoRenderer.cpp

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No changes to commit.'
            exit 0
          }

          git commit -m 'fix: adopt upstream originalVideoSize v2 representation'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the verified source patch commit.'
          }

          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the verified source patch to master.'
          }
