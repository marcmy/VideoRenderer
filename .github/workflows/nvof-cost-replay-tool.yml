name: NVOF Offline Hardware-Cost Replay Tool

on:
  push:
    branches:
      - research/svp4-interpolation-archaeology
    paths:
      - 'tools/native-nvof-probe/NativeNvofCostReplay.cpp'
      - 'tools/native-nvof-probe/NativeNvofCostReplayDual.cpp'
      - 'tools/native-nvof-probe/NativeNvofApi.h'
      - 'tools/native-nvof-probe/Run-NvofCostReplay.cmd'
      - 'tools/native-nvof-probe/Run-All-NvofCostReplay.cmd'
      - 'tools/native-nvof-probe/Run-All-NvofCostReplay.ps1'
      - '.github/workflows/nvof-cost-replay-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvof-cost-replay-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout archaeology branch
        uses: actions/checkout@v7

      - name: Build x64 standalone dual-cost replay tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio C++ toolchain was not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw "vcvars64.bat not found: $vcvars" }

          $release = Join-Path $PWD 'release\NVOF-Cost-Replay'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $source = Join-Path $PWD 'tools\native-nvof-probe\NativeNvofCostReplayDual.cpp'
          $exe = Join-Path $release 'NativeNvofCostReplay.exe'
          $compile = 'call "{0}" >nul && cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /DUNICODE /D_UNICODE "{1}" /Fe:"{2}" /link d3d11.lib dxgi.lib' -f $vcvars, $source, $exe
          cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) {
            throw "cl.exe failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'NativeNvofCostReplay.exe was not produced.'
          }

      - name: Package replay utility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'release\NVOF-Cost-Replay'
          Copy-Item -LiteralPath '.\tools\native-nvof-probe\Run-NvofCostReplay.cmd' -Destination $root -Force
          Copy-Item -LiteralPath '.\tools\native-nvof-probe\Run-All-NvofCostReplay.cmd' -Destination $root -Force
          Copy-Item -LiteralPath '.\tools\native-nvof-probe\Run-All-NvofCostReplay.ps1' -Destination $root -Force

          $readme = @"
          NVOF Offline Hardware-Cost Replay — dual R8/R32
          =================================================

          Purpose
          -------
          Re-run existing MPCVR diagnostic frame pairs through completely
          separate, standalone NVOF sessions with output cost enabled. The tool
          tests modern R8 cost and legacy R32 cost in separate sessions so their
          numeric relationship and any format-dependent flow changes can be
          measured directly on the installed NVIDIA driver.

          This does NOT enable hardware cost inside MPC-HC and does not modify
          MPC Video Renderer, K-Lite, the registry, or installed files.

          Requirements
          ------------
          - Windows x64
          - NVIDIA GPU with Optical Flow support
          - Current NVIDIA display driver exposing nvofapi64.dll
          - Existing MPCVR capture folder(s) containing frame-A.bmp + frame-B.bmp

          One capture
          -----------
          Drag a capture folder onto Run-NvofCostReplay.cmd, or run the .cmd and
          paste the capture-folder path.

          All captures under one root
          ---------------------------
          Drag the root folder containing your capture folders onto
          Run-All-NvofCostReplay.cmd. The batch runner recursively finds every
          directory containing frame-A.bmp + frame-B.bmp and runs them in turn.

          Each capture receives a new subfolder:
            nvof-cost-replay-YYYYMMDD-HHMMSS

          Per-capture output, when the corresponding format is supported:
          - cost-forward-B-to-A-r8.bin / cost-backward-A-to-B-r8.bin
          - cost-forward-B-to-A-r32.bin / cost-backward-A-to-B-r32.bin
          - format-specific replay flow binaries for R8 and R32
          - replay-summary.txt

          The summary reports format support, cost percentiles, replay-vs-live
          flow differences, R8-vs-R32 flow differences, Pearson correlation,
          affine R32-from-R8 fit, median nonzero ratio, and the best simple
          right-shift mapping from legacy R32 to R8.

          The batch runner creates one compact analysis ZIP in the selected root
          folder containing the raw binaries and summaries. Send that ZIP back
          for corpus analysis.

          Important
          ---------
          Each cost format is tested in its own NVOF session. Both use PerfSlow,
          4x4 output grid, bidirectional prediction, and disabled temporal hints.
          Blocking readback is intentional because this is an offline diagnostic,
          never a playback path. Unsupported R32 is recorded rather than treated
          as a failure if R8 succeeds.
          "@
          [IO.File]::WriteAllText((Join-Path $root 'README.txt'), $readme, [Text.UTF8Encoding]::new($false))

          $hash = (Get-FileHash -LiteralPath (Join-Path $root 'NativeNvofCostReplay.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $root 'SHA256.txt'), "$hash  NativeNvofCostReplay.exe`n", [Text.UTF8Encoding]::new($false))

          $zip = Join-Path $PWD 'release\NVOF-Cost-Replay.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'release\NVOF-Cost-Replay.zip.sha256'), "$zipHash  NVOF-Cost-Replay.zip`n", [Text.UTF8Encoding]::new($false))

      - name: Upload replay utility
        uses: actions/upload-artifact@v7
        with:
          name: NVOF-Cost-Replay
          path: |
            release/NVOF-Cost-Replay.zip
            release/NVOF-Cost-Replay.zip.sha256
          compression-level: 0
          if-no-files-found: error
