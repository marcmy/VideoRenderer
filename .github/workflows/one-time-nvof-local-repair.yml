name: One-time native NVOF local repair integration

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-nvof-local-repair.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Integrate occlusion-aware local repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)

          function Write-B64([string]$Path, [string]$Data) {
              $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Data))
              [IO.File]::WriteAllText($Path, $text, $utf8)
          }

          function Replace-B64([string]$Path, [string]$Old64, [string]$New64) {
              $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Old64))
              $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($New64))
              $text = ([IO.File]::ReadAllText($Path) -replace "`r`n", "`n")
              $first = $text.IndexOf($old, [StringComparison]::Ordinal)
              if ($first -lt 0) { throw "Patch target not found in $Path" }
              $second = $text.IndexOf($old, $first + $old.Length, [StringComparison]::Ordinal)
              if ($second -ge 0) { throw "Patch target is not unique in $Path" }
              $text = $text.Replace($old, $new)
              [IO.File]::WriteAllText($Path, $text, $utf8)
          }

          Write-B64 'Source/NvidiaOpticalFlowDenseSeed.hlsl' ''
          Write-B64 'Source/NvidiaOpticalFlowDenseRepair.hlsl' ''
          Write-B64 'Source/NvidiaOpticalFlowDenseWarp.hlsl' ''
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.h' 'ICAgIHN0cnVjdCBSZWdpb25HYXRlUGFyYW1ldGVycyB7Cg==' ''
