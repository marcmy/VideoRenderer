          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.h' 'ICAgIENDb21QdHI8SUQzRDExVGV4dHVyZTJEPiBtX3F1YWxpdHlUZXh0dXJlOwo=' 'ICAgIENDb21QdHI8SUQzRDExVGV4dHVyZTJEPiBtX3JlcGFpclRleHR1cmVzWzJdOwogICAgQ0NvbVB0cjxJRDNEMTFTaGFkZXJSZXNvdXJjZVZpZXc+IG1fcmVwYWlyVmlld3NbMl07CiAgICBDQ29tUHRyPElEM0QxMVVub3JkZXJlZEFjY2Vzc1ZpZXc+IG1fcmVwYWlyVWF2c1syXTsKCiAgICBDQ29tUHRyPElEM0QxMVRleHR1cmUyRD4gbV9xdWFsaXR5VGV4dHVyZTsK'
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.h' 'ICAgIENDb21QdHI8SUQzRDExQnVmZmVyPiBtX3NlZWRQYXJhbWV0ZXJzOwogICAgQ0NvbVB0cjxJRDNEMTFCdWZmZXI+IG1fcmVnaW9uR2F0ZVBhcmFtZXRlcnM7Cg==' 'ICAgIENDb21QdHI8SUQzRDExQnVmZmVyPiBtX3NlZWRQYXJhbWV0ZXJzOwogICAgQ0NvbVB0cjxJRDNEMTFCdWZmZXI+IG1fcmVwYWlyUGFyYW1ldGVyczsKICAgIENDb21QdHI8SUQzRDExQnVmZmVyPiBtX3JlZ2lvbkdhdGVQYXJhbWV0ZXJzOwo='
