          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgIG1fc2VlZFBhcmFtZXRlcnMuUmVsZWFzZSgpOwogICAgbV9yZWdpb25HYXRlUGFyYW1ldGVycy5SZWxlYXNlKCk7Cg==' 'ICAgIG1fc2VlZFBhcmFtZXRlcnMuUmVsZWFzZSgpOwogICAgbV9yZXBhaXJQYXJhbWV0ZXJzLlJlbGVhc2UoKTsKICAgIG1fcmVnaW9uR2F0ZVBhcmFtZXRlcnMuUmVsZWFzZSgpOwo='
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgIGZvciAoYXV0byBpbmRleCA9IDB1OyBpbmRleCA8IDJ1OyArK2luZGV4KSB7CiAgICAgICAgbV9zZWVkVWF2c1tpbmRleF0uUmVsZWFzZSgpOwogICAgICAgIG1fc2VlZFZpZXdzW2luZGV4XS5SZWxlYXNlKCk7CiAgICAgICAgbV9zZWVkVGV4dHVyZXNbaW5kZXhdLlJlbGVhc2UoKTsKICAgIH0KICAgIG1fd2FycFNoYWRlci5SZWxlYXNlKCk7Cg==' ''
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgIG1fcmVnaW9uR2F0ZVNoYWRlci5SZWxlYXNlKCk7CiAgICBtX3NlZWRTaGFkZXIuUmVsZWFzZSgpOwo=' 'ICAgIG1fcmVnaW9uR2F0ZVNoYWRlci5SZWxlYXNlKCk7CiAgICBtX3JlcGFpclNoYWRlci5SZWxlYXNlKCk7CiAgICBtX3NlZWRTaGFkZXIuUmVsZWFzZSgpOwo='
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' '' ''
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgIGNvbnN0IHN0ZDo6YXJyYXk8SUQzRDExVW5vcmRlcmVkQWNjZXNzVmlldyosIDM+IHNlZWRPdXRwdXRzID0gewogICAgICAgIG1fc2VlZFVhdnNbMF0sIG1fcXVhbGl0eVVhdiwgbV91bnNhZmVDZWxsVWF2LAogICAgfTsK' 'ICAgIGNvbnN0IHN0ZDo6YXJyYXk8SUQzRDExVW5vcmRlcmVkQWNjZXNzVmlldyosIDQ+IHNlZWRPdXRwdXRzID0gewogICAgICAgIG1fc2VlZFVhdnNbMF0sIG1fcXVhbGl0eVVhdiwgbV91bnNhZmVDZWxsVWF2LCBtX3JlcGFpclVhdnNbMF0sCiAgICB9Owo='
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgIFVuYmluZENvbXB1dGUoY29udGV4dCk7CgogICAgLy8gQSBsb2NhbCBjYXRhc3Ryb3BoaWMgY2x1c3RlciBjYW4gYmUgdmlzdWFsbHkgdW5hY2NlcHRhYmxlIGV2ZW4gd2hlbiBpdAo=' ' '
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgIGNvbnN0IHN0ZDo6YXJyYXk8SUQzRDExU2hhZGVyUmVzb3VyY2VWaWV3KiwgND4gd2FycElucHV0cyA9IHsKICAgICAgICBwcmV2aW91c0ZyYW1lLCBuZXh0RnJhbWUsIG1fZGVuc2VGbG93VmlldywgbV9xdWFsaXR5VmlldywKICAgIH07Cg==' 'ICAgIGNvbnN0IHN0ZDo6YXJyYXk8SUQzRDExU2hhZGVyUmVzb3VyY2VWaWV3KiwgNT4gd2FycElucHV0cyA9IHsKICAgICAgICBwcmV2aW91c0ZyYW1lLCBuZXh0RnJhbWUsIG1fZGVuc2VGbG93VmlldywgbV9xdWFsaXR5Vmlldywg bV9yZXBhaXJWaWV3c1sxXSwKICAgIH07Cg=='
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgICAgICBtaWRwb2ludFRpbWUsIHswLjBmLCAwLjBmLCAwLjBmfSwK' 'ICAgICAgICBtaWRwb2ludFRpbWUsIDQuMGYsIHswLjBmLCAwLjBmfSwK'
          Replace-B64 '.github/workflows/dense-nvof-shader-validation.yml' 'ICAgICAgICAgICAgQHtTb3VyY2U9J1NvdXJjZS9O dmlkaWFPcHRpY2FsRmxvd0RlbnNlU2VlZC5obHNsJzsgSGVhZGVyPSdTb3VyY2UvTnZpZGlhT3B0aWNhbEZsb3dEZW5zZVNlZWRCeXRlY29kZS5oJzsgTmFtZT0nZ19Odm9mRGVuc2VTZWVkQnl0ZWNvZGUnIH0sCiAgICAgICAgICAgIEB7IFNvdXJjZT0nU291cmNlL052aWRpYU9wdGljYWxGbG93RGVuc2VSZWdpb25HYXRlLmhsc2wnOyBIZWFkZXI9J1NvdXJjZS9O dmlkaWFPcHRpY2FsRmxvd0RlbnNlUmVnaW9uR2F0ZUJ5dGVjb2RlLmgnOyBOYW1lPSdnX052b2ZEZW5zZVJlZ2lvbkdhdGVCeXRlY29kZScgfSwK' 'ICAgICAgICAgICAgQHtTb3VyY2U9J1NvdXJjZS9O  dmlkaWFPcHRpY2FsRmxvd0RlbnNlUmVnaW9uR2F0ZS5obHNsJzsgSGVhZGVyPSdTb3VyY2UvTnZpZGlhT3B0aWNhbEZsb3dEZW5zZVJlZ2lvbkdhdGVCeXRlY29kZS5oJzsgTmFtZT0nZ19Odm9mRGVuc2VSZWdpb25HYXRlQnl0ZWNvZGUnIH0K'

          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }

          $specs = @(
              @{ Source='Source/NvidiaOpticalFlowDenseSeed.hlsl'; Header='Source/NvidiaOpticalFlowDenseSeedBytecode.h'; Name='g_NvofDenseSeedBytecode' },
              @{ Source='Source/NvidiaOpticalFlowDenseRepair.hlsl'; Header='Source/NvidiaOpticalFlowDenseRepairBytecode.h'; Name='g_NvofDenseRepairBytecode' },
              @{ Source='Source/NvidiaOpticalFlowDenseWarp.hlsl'; Header='Source/NvidiaOpticalFlowDenseWarpBytecode.h'; Name='g_NvofDenseWarpBytecode' }
          )
          foreach ($spec in $specs) {
              & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh $spec.Header /Vn $spec.Name $spec.Source
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
              Source/NvidiaOpticalFlowDenseSeed.hlsl `
              Source/NvidiaOpticalFlowDenseSeedBytecode.h `
              Source/NvidiaOpticalFlowDenseRepair.hlsl `
              Source/NvidiaOpticalFlowDenseRepairBytecode.h `
              Source/NvidiaOpticalFlowDenseWarp.hlsl `
              Source/NvidiaOpticalFlowDenseWarpBytecode.h `
              Source/NvidiaOpticalFlowDenseSynthesizer.cpp `
              Source/NvidiaOpticalFlowDenseSynthesizer.h `
              .github/workflows/dense-nvof-shader-validation.yml
          git rm -- .github/workflows/one-time-nvof-local-repair.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'Add occlusion-aware local NVOF repair'
          git push origin HEAD:feature/native-nvof-interpolation
