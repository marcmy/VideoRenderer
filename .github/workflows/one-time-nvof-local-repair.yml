          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' 'ICAgIGNvbnN0IHN0ZDo6YXJyYXk8SUQzRDExVW5vcmRlcmVkQWNjZXNzVmlldyosIDM+IG51bGxVYXZzID0ge307Cg==' 'ICAgIGNvbnN0IHN0ZDo6YXJyYXk8SUQzRDExVW5vcmRlcmVkQWNjZXNzVmlldyosIDQ+IG51bGxVYXZzID0ge307Cg=='
          Replace-B64 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp' '' ''
