name: Validate Maxine setup

on:
  push:
    paths:
      - 'tools/MaxineRuntimeInstaller/**'
      - 'tools/KLiteMaxineUpdater/**'
      - 'tools/MaxineSetup/**'
      - '.github/workflows/validate-maxine-runtime-installer.yml'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - 'tools/MaxineRuntimeInstaller/**'
      - 'tools/KLiteMaxineUpdater/**'
      - 'tools/MaxineSetup/**'
      - '.github/workflows/validate-maxine-runtime-installer.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scripts = @(
            'tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1',
            'tools/MaxineRuntimeInstaller/Export-MPCVRMaxineRuntime.ps1',
            'tools/KLiteMaxineUpdater/Install-KLiteMPCVRUpdater.ps1',
            'tools/KLiteMaxineUpdater/Update-KLiteMPCVR.ps1',
            'tools/MaxineSetup/Install-MPCVR-Maxine.ps1',
            'tools/MaxineSetup/Install-MPCVR-Maxine-RIFE.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count) {
              $errors | Format-List | Out-String | Write-Error
              throw "Windows PowerShell could not parse $script"
            }
          }

      - name: Parse scripts with PowerShell 7
        shell: pwsh
        run: |
          $scripts = @(
            'tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1',
            'tools/MaxineRuntimeInstaller/Export-MPCVRMaxineRuntime.ps1',
            'tools/KLiteMaxineUpdater/Install-KLiteMPCVRUpdater.ps1',
            'tools/KLiteMaxineUpdater/Update-KLiteMPCVR.ps1',
            'tools/MaxineSetup/Install-MPCVR-Maxine.ps1',
            'tools/MaxineSetup/Install-MPCVR-Maxine-RIFE.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell 7 could not parse $script"
            }
          }

      - name: Run built-in runtime validation with both PowerShell hosts
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1 -ValidateOnly -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh.exe -NoLogo -NoProfile -File `
            tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1 -ValidateOnly -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export slim runtime candidate with Windows PowerShell 5.1
        shell: powershell
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'maxine-runtime-test'
          $sourceRoot = Join-Path $testRoot 'source'
          $outputRoot = Join-Path $testRoot 'exported'
          New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null

          $required = @(
            'NVCVImage.dll',
            'NVVideoEffects.dll',
            'nvngxruntime.dll',
            'nvngx_vsr.dll',
            'nvVFXVideoSuperRes.dll'
          )
          foreach ($file in $required) {
            Set-Content -LiteralPath (Join-Path $sourceRoot $file) -Value "mock $file" -Encoding ASCII
          }
          foreach ($file in @('nvinfer_10.dll', 'nppif64_12.dll', 'nvinfer_plugin_10.dll')) {
            Set-Content -LiteralPath (Join-Path $sourceRoot $file) -Value "optional $file" -Encoding ASCII
          }
          Set-Content -LiteralPath (Join-Path $sourceRoot 'LICENSE.txt') -Value 'mock license' -Encoding ASCII

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            tools/MaxineRuntimeInstaller/Export-MPCVRMaxineRuntime.ps1 `
            -SourcePath $sourceRoot `
            -OutputDirectory $outputRoot `
            -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $archive = Join-Path $outputRoot 'MPCVR-Maxine-Runtime.zip'
          $checksum = Join-Path $outputRoot 'MPCVR-Maxine-Runtime.zip.sha256'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Exporter did not create the archive.' }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw 'Exporter did not create the checksum.' }

          $inspectRoot = Join-Path $testRoot 'inspect'
          Expand-Archive -LiteralPath $archive -DestinationPath $inspectRoot -Force
          $runtime = Join-Path $inspectRoot 'MPCVR-Maxine-Runtime\nvvfx\libs'
          foreach ($file in $required + @('LICENSE.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $file) -PathType Leaf)) {
              throw "Slim bundle is missing $file"
            }
          }
          foreach ($file in @('nvinfer_10.dll', 'nppif64_12.dll', 'nvinfer_plugin_10.dll')) {
            if (Test-Path -LiteralPath (Join-Path $runtime $file) -PathType Leaf) {
              throw "Slim bundle unexpectedly contains $file"
            }
          }

          $manifest = Get-Content -LiteralPath (Join-Path $inspectRoot 'MPCVR-Maxine-Runtime\runtime-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.Profile -ne 'CoreFiveFiles') { throw "Unexpected export profile: $($manifest.Profile)" }
          if ($manifest.Files.Count -ne 6) { throw "Unexpected packaged file count: $($manifest.Files.Count)" }
          if ($manifest.ExcludedFiles.Count -ne 3) { throw "Unexpected excluded file count: $($manifest.ExcludedFiles.Count)" }

      - name: Install exported slim candidate with Windows PowerShell 5.1
        shell: powershell
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'maxine-runtime-test'
          $archive = Join-Path $testRoot 'exported\MPCVR-Maxine-Runtime.zip'
          $installRoot = Join-Path $testRoot 'installed'

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1 `
            -RuntimeArchive $archive `
            -InstallRoot $installRoot `
            -SkipEnvironmentUpdate `
            -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $runtime = Join-Path $installRoot 'nvvfx\libs'
          foreach ($file in @(
            'NVCVImage.dll',
            'NVVideoEffects.dll',
            'nvngxruntime.dll',
            'nvngx_vsr.dll',
            'nvVFXVideoSuperRes.dll',
            'LICENSE.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $file) -PathType Leaf)) {
              throw "Installed slim runtime is missing $file"
            }
          }

      - name: Validate assembled Maxine plus RIFE setup with Windows PowerShell 5.1
        shell: powershell
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'maxine-runtime-test'
          $setupRoot = Join-Path $testRoot 'setup'
          $payloadRoot = Join-Path $setupRoot 'payload'
          $rendererSource = Join-Path $testRoot 'renderer-source'
          $rifeArchiveSource = Join-Path $testRoot 'rife-archive-source'
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $rendererSource -Force | Out-Null
          New-Item -ItemType Directory -Path $rifeArchiveSource -Force | Out-Null

          Copy-Item tools/MaxineSetup/Install-MPCVR-Maxine-RIFE.ps1 $setupRoot
          Copy-Item tools/MaxineSetup/Install-MPCVR-Maxine.ps1 $setupRoot
          Copy-Item tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1 $payloadRoot
          Copy-Item tools/RifeRuntimeInstaller/Install-MPCVRRifeRuntime.ps1 $payloadRoot
          Copy-Item tools/RifeRuntimeInstaller/Test-MPCVRRifePreflight.ps1 $payloadRoot
          Copy-Item tools/RifeRuntimeInstaller/RifeRuntimeManifest.psm1 $payloadRoot
          Copy-Item tools/KLiteMaxineUpdater/Install-KLiteMPCVRUpdater.ps1 $payloadRoot
          Copy-Item tools/KLiteMaxineUpdater/Update-KLiteMPCVR.ps1 $payloadRoot
          Copy-Item tools/KLiteMaxineUpdater/KLiteRendererInstall.psm1 $payloadRoot
          Copy-Item (Join-Path $testRoot 'exported\MPCVR-Maxine-Runtime.zip') $payloadRoot

          Set-Content -LiteralPath (Join-Path $rendererSource 'MpcVideoRenderer.ax') -Value 'mock x86 renderer' -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $rendererSource 'MpcVideoRenderer64.ax') -Value 'mock x64 renderer' -Encoding ASCII
          $rendererArchive = Join-Path $payloadRoot 'MpcVideoRenderer-Maxine-RIFE.zip'
          Compress-Archive -Path (Join-Path $rendererSource '*') -DestinationPath $rendererArchive

          $rifeFixture = Join-Path $rifeArchiveSource 'fixture.txt'
          Set-Content -LiteralPath $rifeFixture -Value 'mock RIFE payload' -Encoding ASCII
          Compress-Archive -LiteralPath $rifeFixture -DestinationPath (Join-Path $payloadRoot 'MPCVR-RIFE-Common.zip')
          Compress-Archive -LiteralPath $rifeFixture -DestinationPath (Join-Path $payloadRoot 'MPCVR-RIFE-Model-v4.6.zip')

          $runtimeArchiveNames = @(
            'MPCVR-RIFE-Common.zip',
            'MPCVR-RIFE-sm75.zip',
            'MPCVR-RIFE-sm86.zip',
            'MPCVR-RIFE-sm89.zip',
            'MPCVR-RIFE-sm120.zip'
          )
          foreach ($archiveName in $runtimeArchiveNames | Where-Object { $_ -ne 'MPCVR-RIFE-Common.zip' }) {
            Compress-Archive -LiteralPath $rifeFixture -DestinationPath (Join-Path $rifeArchiveSource $archiveName)
          }

          [pscustomobject]@{
            schemaVersion = 1
            cudaVersion = '12.9.1'
            cudaRuntimeVersion = '12.9.79'
            tensorRtVersion = '11.2.1.2'
            runtimeAbi = 1
            architectures = @(
              [pscustomobject]@{ computeCapability = '7.5'; key = 'sm75'; builderResource = 'nvinfer_builder_resource_sm75_11.dll' },
              [pscustomobject]@{ computeCapability = '8.6'; key = 'sm86'; builderResource = 'nvinfer_builder_resource_sm86_11.dll' },
              [pscustomobject]@{ computeCapability = '8.9'; key = 'sm89'; builderResource = 'nvinfer_builder_resource_sm89_11.dll' },
              [pscustomobject]@{ computeCapability = '12.0'; key = 'sm120'; builderResource = 'nvinfer_builder_resource_sm120_11.dll' }
            )
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $payloadRoot 'RIFE-runtime-manifest.json') -Encoding UTF8

          @(
            foreach ($archiveName in $runtimeArchiveNames) {
              $archivePath = if ($archiveName -eq 'MPCVR-RIFE-Common.zip') {
                Join-Path $payloadRoot $archiveName
              }
              else {
                Join-Path $rifeArchiveSource $archiveName
              }
              $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $archiveName"
            }
          ) | Set-Content -LiteralPath (Join-Path $payloadRoot 'RIFE-runtime-SHA256SUMS.txt') -Encoding ASCII

          [pscustomobject]@{
            schemaVersion = 1
            releaseTag = 'test-release'
            assetBaseUrl = 'https://github.com/marcmy/VideoRenderer/releases/download/test-release'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $payloadRoot 'RIFE-runtime-release.json') -Encoding UTF8

          Push-Location $payloadRoot
          try {
            @(
              Get-ChildItem -File |
                Sort-Object Name |
                ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
                }
            ) | Set-Content -LiteralPath 'PAYLOAD-SHA256SUMS.txt' -Encoding ASCII
          }
          finally {
            Pop-Location
          }

          $inventory = '[{"name":"NVIDIA GeForce RTX 2070 SUPER","computeCapability":"7.5"},{"name":"NVIDIA GeForce RTX 5070","computeCapability":"12.0"}]'
          $inventoryPath = Join-Path $testRoot 'gpu-inventory.json'
          Set-Content -LiteralPath $inventoryPath -Value $inventory -Encoding UTF8
          foreach ($architecture in @('sm75', 'sm86', 'sm89', 'sm120')) {
            if (Test-Path -LiteralPath (Join-Path $payloadRoot "MPCVR-RIFE-$architecture.zip")) {
              throw "Unified setup unexpectedly embeds architecture pack $architecture"
            }
          }
          foreach ($hostExe in @('powershell.exe', 'pwsh.exe')) {
            $output = & $hostExe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
              (Join-Path $setupRoot 'Install-MPCVR-Maxine-RIFE.ps1') `
              -ValidateOnly `
              -GpuInventoryJson $inventoryPath `
              -NoPause 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0) { throw "$hostExe unified setup validation failed with $LASTEXITCODE" }
            if ($output -notmatch 'RIFE architecture downloads: sm75, sm120') {
              throw "$hostExe unified setup did not select exactly sm75 and sm120 for the test inventory"
            }
          }

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            (Join-Path $setupRoot 'Install-MPCVR-Maxine.ps1') `
            -ValidateOnly `
            -GpuInventoryJson $inventoryPath `
            -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove corrupt or missing setup payloads fail before mutation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'maxine-runtime-test'
          $sourceSetup = Join-Path $testRoot 'setup'
          $inventory = '[{"name":"NVIDIA GeForce RTX 2070 SUPER","computeCapability":"7.5"}]'
          $inventoryPath = Join-Path $testRoot 'gpu-inventory-single.json'
          Set-Content -LiteralPath $inventoryPath -Value $inventory -Encoding UTF8

          function Set-MarkerInstaller([string]$SetupRoot, [string]$MarkerPath) {
            $payloadRoot = Join-Path $SetupRoot 'payload'
            @(
              'param([string]$RuntimeArchive,[switch]$NoPause,[switch]$ValidateOnly)',
              "Set-Content -LiteralPath '$MarkerPath' -Value 'mutated' -Encoding ASCII",
              'exit 0'
            ) | Set-Content -LiteralPath (Join-Path $payloadRoot 'Install-MPCVRMaxineRuntime.ps1') -Encoding ASCII

            @(
              Get-ChildItem -LiteralPath $payloadRoot -File |
                Where-Object Name -ne 'PAYLOAD-SHA256SUMS.txt' |
                Sort-Object Name |
                ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
                }
            ) | Set-Content -LiteralPath (Join-Path $payloadRoot 'PAYLOAD-SHA256SUMS.txt') -Encoding ASCII
          }

          $corruptRoot = Join-Path $testRoot 'setup-corrupt'
          Copy-Item -LiteralPath $sourceSetup -Destination $corruptRoot -Recurse
          $corruptMarker = Join-Path $corruptRoot 'MUTATION-MARKER.txt'
          Set-MarkerInstaller -SetupRoot $corruptRoot -MarkerPath $corruptMarker
          Add-Content -LiteralPath (Join-Path $corruptRoot 'payload\MPCVR-RIFE-Common.zip') -Value 'corruption' -Encoding ASCII

          $output = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            (Join-Path $corruptRoot 'Install-MPCVR-Maxine-RIFE.ps1') `
            -GpuInventoryJson $inventoryPath `
            -NoPause 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -eq 0) { throw 'Corrupt setup payload unexpectedly passed.' }
          if ($output -notmatch 'SHA-256 verification failed') { throw 'Corrupt setup payload did not fail hash verification.' }
          if (Test-Path -LiteralPath $corruptMarker) { throw 'A component installer ran before corrupt payload rejection.' }
          $global:LASTEXITCODE = 0

          $missingRoot = Join-Path $testRoot 'setup-missing-checksum'
          Copy-Item -LiteralPath $sourceSetup -Destination $missingRoot -Recurse
          $missingMarker = Join-Path $missingRoot 'MUTATION-MARKER.txt'
          Set-MarkerInstaller -SetupRoot $missingRoot -MarkerPath $missingMarker
          Remove-Item -LiteralPath (Join-Path $missingRoot 'payload\PAYLOAD-SHA256SUMS.txt') -Force

          $output = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            (Join-Path $missingRoot 'Install-MPCVR-Maxine-RIFE.ps1') `
            -GpuInventoryJson $inventoryPath `
            -NoPause 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -eq 0) { throw 'Missing setup checksum unexpectedly passed.' }
          if ($output -notmatch 'PAYLOAD-SHA256SUMS.txt') { throw 'Missing setup checksum failure did not identify the missing checksum file.' }
          if (Test-Path -LiteralPath $missingMarker) { throw 'A component installer ran before missing checksum rejection.' }
          $global:LASTEXITCODE = 0
