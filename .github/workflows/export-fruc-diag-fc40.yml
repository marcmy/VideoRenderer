name: Export FRUC diagnostic fc40 source

on:
  push:
    branches: [diag/nvoffruc-seek-freeze-fc40]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diag/nvoffruc-seek-freeze-fc40
          fetch-depth: 0
          submodules: false
      - name: Package exact source
        shell: bash
        run: git archive --format=zip --output=VideoRenderer-fruc-diag-fc40-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: VideoRenderer-fruc-diag-fc40-source
          path: VideoRenderer-fruc-diag-fc40-source.zip
          compression-level: 0
          retention-days: 1
