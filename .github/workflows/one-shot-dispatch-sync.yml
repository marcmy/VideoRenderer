name: One-shot dispatch upstream sync

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/one-shot-dispatch-sync.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Dispatch Sync upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-upstream.yml --ref master --repo "$GITHUB_REPOSITORY"

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-dispatch-sync.yml
          git commit -m 'ci: remove one-shot sync dispatcher'
          git push origin HEAD:master
