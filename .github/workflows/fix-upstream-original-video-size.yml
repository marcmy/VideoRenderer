name: One-shot upstream source fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-upstream-original-video-size.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Apply missing upstream originalVideoSize change
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Source/VideoRenderer.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }

          $functionPattern = '(?ms)STDMETHODIMP CMpcVideoRenderer::Flt_GetInt64\(LPCSTR field, __int64 \*value\)\r?\n\{.*?\r?\n\}'
          $match = [regex]::Match($text, $functionPattern)
          if (-not $match.Success) {
            throw 'Could not locate CMpcVideoRenderer::Flt_GetInt64.'
          }

          if ($match.Value -match '"originalVideoSize"') {
            Write-Host 'originalVideoSize is already present in Flt_GetInt64.'
          }
          else {
            $needle = "`t`treturn S_OK;$nl`t}$nl$nl`treturn E_INVALIDARG;"
            if (-not $match.Value.Contains($needle)) {
              throw 'Flt_GetInt64 did not match the expected version-only layout.'
            }

            $replacement = "`t`treturn S_OK;$nl" +
                           "`t} else if (!strcmp(field, `"originalVideoSize`")) {$nl" +
                           "`t`tlong width, height;$nl" +
                           "`t`tm_VideoProcessor->GetVideoSize(width, height);$nl" +
                           "`t`t*value = (static_cast<__int64>(width) << 32) | (static_cast<__int64>(height) & 0xFFFFFFFF);$nl$nl" +
                           "`t`treturn S_OK;$nl" +
                           "`t}$nl$nl" +
                           "`treturn E_INVALIDARG;"

            $newFunction = $match.Value.Replace($needle, $replacement)
            $text = $text.Substring(0, $match.Index) + $newFunction + $text.Substring($match.Index + $match.Length)
            [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Build patched source
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) {
            throw "Patched source failed to build with exit code $LASTEXITCODE."
          }

      - name: Commit verified patch and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/fix-upstream-original-video-size.yml
          git add Source/VideoRenderer.cpp

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No changes to commit.'
            exit 0
          }

          git commit -m 'fix: preserve upstream originalVideoSize API change'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the verified source patch commit.'
          }

          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the verified source patch to master.'
          }
