name: Supply-chain audit

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/supply-chain-audit.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-orphaned-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Delete runs for removed workflow files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Current workflow files:"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100"             --jq '.workflows[] | [.id, .name, .path] | @tsv' |
          while IFS=$'\t' read -r workflow_id workflow_name workflow_path; do
            case "$workflow_path" in
              .github/workflows/*) ;;
              *) continue ;;
            esac

            if [[ -f "$workflow_path" ]]; then
              echo "KEEP   $workflow_name ($workflow_path)"
              continue
            fi

            echo "CLEAN  $workflow_name ($workflow_path)"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100"               --jq '.workflow_runs[].id' |
            while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              echo "  delete run $run_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            done
          done
