name: Supply-chain audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Every Monday at 07:23 UTC
    - cron: "23 7 * * 1"

permissions: {}

jobs:
  trivy:
    name: Trivy security scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      # Install an exact Trivy release from GitHub instead of letting the action
      # resolve "latest" through get.trivy.dev, which stopped resolving in DNS.
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          dir="${RUNNER_TEMP}/trivy"
          mkdir -p "${dir}/bin"
          cd "${dir}"
          curl -fsSL --retry 3 -o "${asset}" "${base}/${asset}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          grep -qx "${TRIVY_SHA256}  ${asset}" checksums.txt
          tar -xzf "${asset}" -C bin trivy
          echo "${dir}/bin" >> "${GITHUB_PATH}"
          "${dir}/bin/trivy" --version
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload findings to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  syft:
    name: Generate independent SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          dependency-snapshot: true
          upload-artifact: true
          upload-release-assets: false
