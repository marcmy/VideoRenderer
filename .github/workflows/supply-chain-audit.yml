name: Supply-chain audit

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/supply-chain-audit.yml

permissions: {}

jobs:
  cleanup-retired-maxine-workflows:
    name: Remove retired Maxine workflow history
    if: github.head_ref == 'cleanup/maxine-actions-sidebar'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete historical runs from temporary workflows
        shell: bash
        run: |
          set -euo pipefail

          declare -A target_names=(
            ["Apply Maxine panel source"]=1
            ["Apply Maxine panel source v2"]=1
            ["Export Maxine source snapshot"]=1
            ["Fix Maxine quality clamp"]=1
            ["Repository cleanup"]=1
          )

          declare -A target_paths=(
            [".github/workflows/apply-maxine-panel.yml"]=1
            [".github/workflows/apply-maxine-panel-v2.yml"]=1
            [".github/workflows/export-maxine-source.yml"]=1
            [".github/workflows/fix-maxine-clamp.yml"]=1
            [".github/workflows/repository-cleanup.yml"]=1
          )

          mapfile -t runs < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .path] | @tsv'
          )

          matched=0
          deleted=0
          failed=0

          for row in "${runs[@]}"; do
            IFS=$'\t' read -r run_id workflow_name workflow_path <<< "$row"

            if [[ -z "${target_names[$workflow_name]+present}" && -z "${target_paths[$workflow_path]+present}" ]]; then
              continue
            fi

            matched=$((matched + 1))
            echo "Deleting run ${run_id}: ${workflow_name} (${workflow_path})"
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done

          remaining=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(
              (.name == "Apply Maxine panel source") or
              (.name == "Apply Maxine panel source v2") or
              (.name == "Export Maxine source snapshot") or
              (.name == "Fix Maxine quality clamp") or
              (.name == "Repository cleanup") or
              (.path == ".github/workflows/apply-maxine-panel.yml") or
              (.path == ".github/workflows/apply-maxine-panel-v2.yml") or
              (.path == ".github/workflows/export-maxine-source.yml") or
              (.path == ".github/workflows/fix-maxine-clamp.yml") or
              (.path == ".github/workflows/repository-cleanup.yml")
            )] | length' | awk '{sum += $1} END {print sum + 0}')

          {
            echo "## Retired Maxine workflow cleanup"
            echo
            echo "- Matched runs: ${matched}"
            echo "- Deleted runs: ${deleted}"
            echo "- Failed deletions: ${failed}"
            echo "- Remaining targeted runs: ${remaining}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failed > 0 || remaining > 0 )); then
            exit 1
          fi

      - name: Delete temporary cleanup branch
        if: success()
        shell: bash
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/cleanup/maxine-actions-sidebar"
