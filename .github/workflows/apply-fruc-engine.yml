name: Apply NvOFFRUC engine source

on:
  push:
    branches:
      - feature/nvoffruc-engine
    paths:
      - '.github/workflows/apply-fruc-engine.yml'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/nvoffruc-engine' || github.ref == 'refs/heads/feature/nvoffruc-engine'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/nvoffruc-engine
          fetch-depth: 0
          submodules: recursive

      - name: Verify, decode, and apply source patch
        shell: bash
        run: |
          cat .github/fruc-engine.patch.part-* | tr -d '\r\n' > "$RUNNER_TEMP/fruc-engine.patch.gz.b64"
          echo "65f22defa766bb53fe93a84e5934b26482778763242c404a75cd1e54bd5b6022  $RUNNER_TEMP/fruc-engine.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/fruc-engine.patch.gz.b64" > "$RUNNER_TEMP/fruc-engine.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/fruc-engine.patch.gz" > "$RUNNER_TEMP/fruc-engine.patch"
          echo "db564a19dca9ecfd23b99718787145e4e7e3b4ea719e61a340bad4bcc8edecaf  $RUNNER_TEMP/fruc-engine.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/fruc-engine.patch"
          git apply "$RUNNER_TEMP/fruc-engine.patch"
          rm -f .github/fruc-engine.patch.part-* .github/workflows/apply-fruc-engine.yml

      - name: Commit engine source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement NvOFFRUC frame interpolation engine"
          git push origin HEAD:feature/nvoffruc-engine
