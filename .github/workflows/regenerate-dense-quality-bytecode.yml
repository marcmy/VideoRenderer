name: Regenerate dense quality bytecode

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/regenerate-dense-quality-bytecode.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Regenerate modified dense SM5 bytecode
        shell: pwsh
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }

          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh Source/NvidiaOpticalFlowDenseSeedBytecode.h /Vn g_NvofDenseSeedBytecode Source/NvidiaOpticalFlowDenseSeed.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh Source/NvidiaOpticalFlowDenseWarpBytecode.h /Vn g_NvofDenseWarpBytecode Source/NvidiaOpticalFlowDenseWarp.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/NvidiaOpticalFlowDenseSeedBytecode.h Source/NvidiaOpticalFlowDenseWarpBytecode.h
          git commit -m 'Regenerate dense NVOF quality-gate bytecode'
          git push origin HEAD:feature/native-nvof-interpolation
