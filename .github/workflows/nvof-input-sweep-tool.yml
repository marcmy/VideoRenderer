name: NVOF Input Format and Grid Sweep Tool

on:
  push:
    branches:
      - research/svp4-interpolation-archaeology
    paths:
      - 'tools/native-nvof-probe/NativeNvofInputSweep.cpp'
      - 'tools/native-nvof-probe/NativeNvofApi.h'
      - 'tools/native-nvof-probe/Run-NvofInputSweep.cmd'
      - 'tools/native-nvof-probe/Run-All-NvofInputSweep.cmd'
      - 'tools/native-nvof-probe/Run-All-NvofInputSweep.ps1'
      - '.github/workflows/nvof-input-sweep-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvof-input-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout archaeology branch
        uses: actions/checkout@v7

      - name: Build x64 standalone input sweep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio C++ toolchain was not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $release = Join-Path $PWD 'release\NVOF-Input-Sweep'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $source = Join-Path $PWD 'tools\native-nvof-probe\NativeNvofInputSweep.cpp'
          $exe = Join-Path $release 'NativeNvofInputSweep.exe'
          $compile = 'call "{0}" >nul && cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /DUNICODE /D_UNICODE "{1}" /Fe:"{2}" /link d3d11.lib dxgi.lib' -f $vcvars, $source, $exe
          cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'NativeNvofInputSweep.exe was not produced.' }

      - name: Package sweep utility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'release\NVOF-Input-Sweep'
          Copy-Item -LiteralPath '.\tools\native-nvof-probe\Run-NvofInputSweep.cmd' -Destination $root -Force
          Copy-Item -LiteralPath '.\tools\native-nvof-probe\Run-All-NvofInputSweep.cmd' -Destination $root -Force
          Copy-Item -LiteralPath '.\tools\native-nvof-probe\Run-All-NvofInputSweep.ps1' -Destination $root -Force
          $readme = @"
          NVOF Input Format / Effective Grid Sweep
          =========================================

          Purpose
          -------
          Offline, cost-disabled comparison of the main NVOF-input differences
          between MPCVR and SVP.

          Variants
          --------
          - bgra-native: exact full-size BGRA geometry used by current MPCVR.
          - bgra-g4 / nv12-g4: SVP-style right/bottom crop to a multiple of 4.
          - BGRA8 and NV12 at effective grids 8, 12, 16, 24 when SVP's minimum
            vector-source dimensions permit them.

          Every variant gets a fresh NVOF session using PerfSlow, native grid4,
          bidirectional prediction, temporal hints disabled, OUTPUT COST OFF.
          No MPC-HC, renderer, K-Lite, registry, or installed file is modified.

          SVP-like geometry
          -----------------
          For effective grid G:
            cropW  = sourceW - sourceW % G
            cropH  = sourceH - sourceH % G
            inputW = cropW / G * 4
            inputH = cropH / G * 4

          NVIDIA still produces a native 4x4 vector grid over that resized input.

          NV12 preprocessing
          ------------------
          The supplied capture BMP is converted to BT.709 limited-range YUV420
          BEFORE Y/U/V planes are resized separately with Catmull-Rom bicubic
          (B=0,C=0.5). This matches the ordering of the shipped VapourSynth SVP
          script more closely than RGB-resize-then-convert.

          It is still an approximation because the capture BMP has already gone
          through video->RGB rendering; it cannot recreate the decoder's original
          YUV420 samples bit-for-bit.

          One capture
          -----------
          Drag a capture folder onto Run-NvofInputSweep.cmd.

          Whole corpus
          ------------
          Drag the root containing capture folders onto Run-All-NvofInputSweep.cmd.
          The batch runner recursively processes every folder containing both
          frame-A.bmp and frame-B.bmp and creates a compact
          NVOF-Input-Sweep-Batch-*.zip containing flow binaries and summaries.

          That compact ZIP is the useful artifact to send back for analysis.
          "@
          [IO.File]::WriteAllText((Join-Path $root 'README.txt'), $readme, [Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash -LiteralPath (Join-Path $root 'NativeNvofInputSweep.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $root 'SHA256.txt'), "$hash  NativeNvofInputSweep.exe`n", [Text.UTF8Encoding]::new($false))
          $zip = Join-Path $PWD 'release\NVOF-Input-Sweep.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'release\NVOF-Input-Sweep.zip.sha256'), "$zipHash  NVOF-Input-Sweep.zip`n", [Text.UTF8Encoding]::new($false))

      - name: Upload sweep utility
        uses: actions/upload-artifact@v7
        with:
          name: NVOF-Input-Sweep
          path: |
            release/NVOF-Input-Sweep.zip
            release/NVOF-Input-Sweep.zip.sha256
          compression-level: 0
          if-no-files-found: error
