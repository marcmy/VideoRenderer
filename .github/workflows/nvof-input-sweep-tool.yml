name: NVOF Input Format and Grid Sweep Tool

on:
  push:
    branches:
      - research/svp4-interpolation-archaeology
    paths:
      - 'tools/native-nvof-probe/NativeNvofInputSweep.cpp'
      - 'tools/native-nvof-probe/NativeNvofApi.h'
      - 'tools/native-nvof-probe/Run-NvofInputSweep.cmd'
      - '.github/workflows/nvof-input-sweep-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvof-input-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout archaeology branch
        uses: actions/checkout@v7

      - name: Build x64 standalone input sweep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio C++ toolchain was not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $release = Join-Path $PWD 'release\NVOF-Input-Sweep'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $source = Join-Path $PWD 'tools\native-nvof-probe\NativeNvofInputSweep.cpp'
          $exe = Join-Path $release 'NativeNvofInputSweep.exe'
          $compile = 'call "{0}" >nul && cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /DUNICODE /D_UNICODE "{1}" /Fe:"{2}" /link d3d11.lib dxgi.lib' -f $vcvars, $source, $exe
          cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'NativeNvofInputSweep.exe was not produced.' }

      - name: Package sweep utility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'release\NVOF-Input-Sweep'
          Copy-Item -LiteralPath '.\tools\native-nvof-probe\Run-NvofInputSweep.cmd' -Destination $root -Force
          $readme = @"
          NVOF Input Format / Effective Grid Sweep
          =========================================

          Purpose
          -------
          Offline flow-only comparison of BGRA8 versus NV12 NVOF input at
          effective full-resolution grids 4, 8, 16, 24, and 32. Output cost is
          disabled. Each variant uses a fresh NVOF session with PerfSlow,
          bidirectional prediction, and temporal hints disabled.

          This tool does not install or modify MPC Video Renderer or K-Lite.

          Usage
          -----
          Drag one MPCVR diagnostic capture folder containing frame-A.bmp and
          frame-B.bmp onto Run-NvofInputSweep.cmd.

          The tool creates nvof-input-sweep-* inside that capture and writes
          raw forward/backward S10.5 flow for every supported variant plus an
          input-sweep-summary.txt describing dimensions, source scale, format
          support, and execute/readback time.

          Important interpretation
          ------------------------
          Grid downscale follows SVP's effective-grid geometry: the source is
          right/bottom cropped to a multiple of the requested effective grid,
          then resized so NVIDIA's native 4x4 output corresponds to that grid
          in full-resolution pixels.

          The CPU resize uses Mitchell-Netravali bicubic B=C=1/3, matching the
          default Bicubic behavior used by AviSynth/VapourSynth. Because the
          original diagnostic frames are BGRA captures rather than SVP's
          original YUV source, the NV12 conversion is a controlled format test,
          not a claim of bit-exact SVP preprocessing.
          "@
          [IO.File]::WriteAllText((Join-Path $root 'README.txt'), $readme, [Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash -LiteralPath (Join-Path $root 'NativeNvofInputSweep.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $root 'SHA256.txt'), "$hash  NativeNvofInputSweep.exe`n", [Text.UTF8Encoding]::new($false))
          $zip = Join-Path $PWD 'release\NVOF-Input-Sweep.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'release\NVOF-Input-Sweep.zip.sha256'), "$zipHash  NVOF-Input-Sweep.zip`n", [Text.UTF8Encoding]::new($false))

      - name: Upload sweep utility
        uses: actions/upload-artifact@v7
        with:
          name: NVOF-Input-Sweep
          path: |
            release/NVOF-Input-Sweep.zip
            release/NVOF-Input-Sweep.zip.sha256
          compression-level: 0
          if-no-files-found: error
