name: Validate calibration tooling

on:
  push:
    paths:
      - 'tools/UnifiedSetup/MpcvrSetup.Telemetry.psm1'
      - 'tools/UnifiedSetup/MpcvrSetup.Profiles.psm1'
      - 'tools/UnifiedSetup/MpcvrSetup.Common.psm1'
      - 'tools/UnifiedSetup/Get-MpcvrRendererTelemetry.ps1'
      - 'tools/UnifiedSetup/Invoke-MpcvrCalibration.ps1'
      - 'tools/UnifiedSetup/Calibrate-Mpcvr.cmd'
      - '.github/workflows/calibration-tool-validation.yml'
  pull_request:
    paths:
      - 'tools/UnifiedSetup/MpcvrSetup.Telemetry.psm1'
      - 'tools/UnifiedSetup/MpcvrSetup.Profiles.psm1'
      - 'tools/UnifiedSetup/MpcvrSetup.Common.psm1'
      - 'tools/UnifiedSetup/Get-MpcvrRendererTelemetry.ps1'
      - 'tools/UnifiedSetup/Invoke-MpcvrCalibration.ps1'
      - 'tools/UnifiedSetup/Calibrate-Mpcvr.cmd'
      - '.github/workflows/calibration-tool-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\UnifiedSetup\Get-MpcvrRendererTelemetry.ps1 `
            -ValidateOnly
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\UnifiedSetup\Invoke-MpcvrCalibration.ps1 `
            -ValidateOnly

      - name: Validate with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\UnifiedSetup\Get-MpcvrRendererTelemetry.ps1 -ValidateOnly
          .\tools\UnifiedSetup\Invoke-MpcvrCalibration.ps1 -ValidateOnly
