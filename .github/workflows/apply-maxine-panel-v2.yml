name: Apply Maxine panel source v2

on:
  push:
    branches:
      - feature/maxine-settings-panel-v2
    paths:
      - .github/workflows/apply-maxine-panel-v2.yml
      - .maxine-stage/**
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/maxine-settings-panel-v2
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .maxine-stage/part* > /tmp/maxine-panel-source.b64
          test "$(wc -c < /tmp/maxine-panel-source.b64)" -eq 106624
          base64 --decode /tmp/maxine-panel-source.b64 > /tmp/maxine-panel-source.zip
          echo "bb7d0bad9f505bb2af2bd9d6546b6509de4ab0d3d2f023647d62eb3c1d6270a8  /tmp/maxine-panel-source.zip" | sha256sum -c -
          unzip -t /tmp/maxine-panel-source.zip

      - name: Apply source and remove staging
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/maxine-panel-source.zip -d .
          rm -rf .maxine-stage
          rm -f .github/workflows/apply-maxine-panel-v2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: add dedicated NVIDIA Maxine settings panel"
          git push origin HEAD:feature/maxine-settings-panel-v2

      - name: Dispatch renderer build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref feature/maxine-settings-panel-v2 --repo "${GITHUB_REPOSITORY}"
