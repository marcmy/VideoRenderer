name: Sync upstream

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-upstream.yml
      - .github/scripts/resolve-upstream-superres.ps1
      - .github/scripts/test-upstream-superres-resolver.ps1
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-2022

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Validate SuperRes resolver
        shell: pwsh
        run: .\.github\scripts\test-upstream-superres-resolver.ps1

      - name: Fetch and merge upstream
        id: merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Aleksoid1978/VideoRenderer master.'
          }

          $pending = [int](git rev-list --count HEAD..upstream/master)
          "pending=$pending" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($pending -eq 0) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'Already synchronized with upstream.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $upstreamSha = (git rev-parse upstream/master).Trim()
          $shortSha = $upstreamSha.Substring(0, 8)
          $originalHead = (git rev-parse HEAD).Trim()

          git merge --no-ff --no-edit -m "Merge Aleksoid1978/VideoRenderer upstream master ($shortSha)" upstream/master
          if ($LASTEXITCODE -ne 0) {
            $conflicts = @(git diff --name-only --diff-filter=U)

            git merge-base --is-ancestor 75f29085995b57aa83066d665a05e134b0766297 $originalHead
            $windowForkLineageKnown = $LASTEXITCODE -eq 0
            $windowResolverDelta = @(git diff --name-only 75f29085995b57aa83066d665a05e134b0766297..$originalHead)
            $onlyWindowResolverChanges = @($windowResolverDelta | Where-Object { $_ -ne '.github/workflows/sync-upstream.yml' }).Count -eq 0

            $windowProcConflict = $windowForkLineageKnown -and $onlyWindowResolverChanges -and
              $upstreamSha -eq '99f1be6ee54025c121b17b77da37dd50b9acf649' -and
              $conflicts.Count -eq 1 -and $conflicts[0] -eq 'Source/VideoRenderer.cpp'

            # Upstream 6bb2f3d adds NV16 support after moving common headers onto
            # the solution Include path. This fork keeps the renderer declaration
            # in VideoRendererLegacy.h behind the RIFE migration wrapper, so replay
            # those upstream edits into the fork-owned layout rather than replacing it.
            git merge-base --is-ancestor cb6e6135e8eeb0f1501e5b9e237843f6567d9aa7 $originalHead
            $nv16ForkLineageKnown = $LASTEXITCODE -eq 0
            $nv16ResolverDelta = @(git diff --name-only cb6e6135e8eeb0f1501e5b9e237843f6567d9aa7..$originalHead)
            $onlyNv16ResolverChanges = @($nv16ResolverDelta | Where-Object { $_ -ne '.github/workflows/sync-upstream.yml' }).Count -eq 0
            $nv16ExpectedConflicts = @(
              'Source/DX11VideoProcessor.cpp',
              'Source/VideoRenderer.cpp',
              'Source/VideoRenderer.h'
            )
            $nv16ActualConflicts = @($conflicts | Sort-Object)
            $nv16ConflictSetMatches = $nv16ActualConflicts.Count -eq $nv16ExpectedConflicts.Count -and
              -not (Compare-Object $nv16ActualConflicts ($nv16ExpectedConflicts | Sort-Object))

            $nv16CompatConflict = $nv16ForkLineageKnown -and $onlyNv16ResolverChanges -and
              $upstreamSha -eq '6bb2f3d702993f04e888bf5abd0944a83333b3c5' -and
              $nv16ConflictSetMatches

            # Resolve only the exact reviewed SuperRes hunk. Preserve both the
            # upstream ACM restriction and the fork's Maxine exclusion, without
            # discarding unrelated upstream changes in the same source file.
            $superResConflict = $conflicts.Count -eq 1 -and
              $conflicts[0] -eq 'Source/DX11VideoProcessor.cpp' -and
              (& .\.github\scripts\resolve-upstream-superres.ps1 -Probe)

            if ($superResConflict) {
              & .\.github\scripts\resolve-upstream-superres.ps1
              git add -- Source/DX11VideoProcessor.cpp
              if ($LASTEXITCODE -ne 0) { throw 'Could not stage the resolved SuperRes hunk.' }
              git diff --check --cached
              if ($LASTEXITCODE -ne 0) { throw 'Resolved SuperRes merge failed whitespace checks.' }
              $remaining = @(git diff --name-only --diff-filter=U)
              if ($remaining.Count -ne 0) { throw 'SuperRes resolver left unresolved paths.' }
              git commit --no-edit
              if ($LASTEXITCODE -ne 0) { throw 'Could not commit the resolved SuperRes merge.' }
            } elseif ($nv16CompatConflict) {
              git checkout --ours -- Source/DX11VideoProcessor.cpp Source/VideoRenderer.cpp Source/VideoRenderer.h
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not restore fork-owned files for the NV16/include-path conflict.'
              }

              function Replace-RequiredText([string]$Path, [string]$Old, [string]$New) {
                $text = Get-Content -Raw -LiteralPath $Path
                if (-not $text.Contains($Old)) {
                  throw "Expected compatibility text was not found in ${Path}: $Old"
                }
                $text = $text.Replace($Old, $New)
                Set-Content -LiteralPath $Path -Value $text -NoNewline -Encoding utf8
              }

              Replace-RequiredText 'Source/DX11VideoProcessor.cpp' '#include "../Include/Version.h"' '#include "Version.h"'
              Replace-RequiredText 'Source/DX11VideoProcessor.cpp' '#include "../Include/ID3DVideoMemoryConfiguration.h"' '#include <ID3DVideoMemoryConfiguration.h>'
              Replace-RequiredText 'Source/VideoRendererLegacy.inl' '#include "../Include/Version.h"' '#include "Version.h"'

              Replace-RequiredText 'Source/VideoRendererLegacy.h' '#include "../Include/ISubRender.h"' '#include <ISubRender.h>'
              Replace-RequiredText 'Source/VideoRendererLegacy.h' '#include "../Include/ISubRender11.h"' '#include <ISubRender11.h>'
              Replace-RequiredText 'Source/VideoRendererLegacy.h' '#include "../Include/ID3DFullscreenControl.h"' '#include <ID3DFullscreenControl.h>'
              Replace-RequiredText 'Source/VideoRendererLegacy.h' '#include "../Include/FilterInterfacesImpl.h"' '#include <FilterInterfacesImpl.h>'
              Replace-RequiredText 'Source/VideoRendererLegacy.h' '#include "../Include/SubRenderIntf.h"' '#include <SubRenderIntf.h>'

              $legacyPath = 'Source/VideoRendererLegacy.h'
              $legacyText = Get-Content -Raw -LiteralPath $legacyPath
              if ($legacyText.Contains('MEDIASUBTYPE_NV16')) {
                throw 'VideoRendererLegacy.h unexpectedly already contains NV16 while resolving the guarded upstream conflict.'
              }
              $newline = if ($legacyText.Contains("`r`n")) { "`r`n" } else { "`n" }
              $nv16Anchor = "`t{&MEDIATYPE_Video, &MEDIASUBTYPE_Y42B}," + $newline
              if (-not $legacyText.Contains($nv16Anchor)) {
                throw 'Could not locate the Y42B media subtype entry in VideoRendererLegacy.h.'
              }
              $legacyText = $legacyText.Replace(
                $nv16Anchor,
                $nv16Anchor + "`t{&MEDIATYPE_Video, &MEDIASUBTYPE_NV16}," + $newline
              )
              Set-Content -LiteralPath $legacyPath -Value $legacyText -NoNewline -Encoding utf8

              git add -- Source/DX11VideoProcessor.cpp Source/VideoRenderer.cpp Source/VideoRenderer.h Source/VideoRendererLegacy.h Source/VideoRendererLegacy.inl

              $remaining = @(git diff --name-only --diff-filter=U)
              if ($remaining.Count -ne 0) {
                throw "NV16/include-path resolver left unresolved paths: $($remaining -join ', ')"
              }

              git commit --no-edit
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not commit the resolved NV16/include-path upstream merge.'
              }
            } elseif ($windowProcConflict) {
              git checkout --ours -- Source/VideoRenderer.cpp
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not restore the fork side of the known window-procedure conflict.'
              }

              $patchFile = Join-Path $env:RUNNER_TEMP 'upstream-window-proc.patch'
              git diff fbe023199b9c9ebf78c730ff9b85288a29bcca3c 99f1be6ee54025c121b17b77da37dd50b9acf649 --output=$patchFile -- Source/VideoRenderer.cpp
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not generate the known upstream window-procedure patch.'
              }

              git apply --whitespace=nowarn $patchFile
              if ($LASTEXITCODE -ne 0) {
                throw 'The known upstream window-procedure patch no longer applies cleanly; refusing automatic conflict resolution.'
              }

              git add -- Source/VideoRenderer.cpp

              $remaining = @(git diff --name-only --diff-filter=U)
              if ($remaining.Count -ne 0) {
                throw "Known window-procedure resolver left unresolved paths: $($remaining -join ', ')"
              }

              git commit --no-edit
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not commit the resolved upstream window-procedure merge.'
              }
            } else {
              git merge-base --is-ancestor 73ef32e79ac09152b8cfa16ddea2b04303958d7f $originalHead
              $forkLineageKnown = $LASTEXITCODE -eq 0
              $resolverDelta = @(git diff --name-only 73ef32e79ac09152b8cfa16ddea2b04303958d7f..$originalHead)
              $onlyResolverChanges = @($resolverDelta | Where-Object { $_ -ne '.github/workflows/sync-upstream.yml' }).Count -eq 0

              git merge-base --is-ancestor bb3f8ef27a3a3bb553a59bc1ed4abcb6aa970d02 upstream/master
              $containsKnownUpstream = $LASTEXITCODE -eq 0

              $knownConflict = $forkLineageKnown -and $onlyResolverChanges -and $containsKnownUpstream -and $conflicts.Count -eq 1 -and $conflicts[0] -eq 'Source/VideoRenderer.cpp'

              if ($knownConflict) {
                git checkout --ours -- Source/VideoRenderer.cpp
                if ($LASTEXITCODE -ne 0) {
                  throw 'Could not restore the fork side of the known VideoRenderer.cpp conflict.'
                }

                $path = 'Source/VideoRenderer.cpp'
                $text = Get-Content -Raw -LiteralPath $path
                $newline = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
                $old = @(
                  "`telse if (!strcmp(field, `"yuvMatrix`")) {",
                  "`t`tstr = L`"TV.709`";",
                  "`t`t// TODO",
                  "`t}"
                ) -join $newline
                $new = @(
                  "`telse if (!strcmp(field, `"yuvMatrix`")) {",
                  "`t`tauto fmt = m_VideoProcessor->inputFormat();",
                  "`t`tif (fmt.value != 0) {",
                  "`t`t`tswitch (fmt.VideoTransferMatrix) {",
                  "`t`t`t`tcase DXVA2_VideoTransferMatrix_BT709: str = L`"TV.709`"; break;",
                  "`t`t`t`tcase MFVideoTransferMatrix_BT2020_10: str = L`"TV.2020`"; break;",
                  "`t`t`t`tdefault: str = L`"TV.601`"; break;",
                  "`t`t`t}",
                  "`t`t} else {",
                  "`t`t`tstr = L`"TV.709`";",
                  "`t`t}",
                  "`t}"
                ) -join $newline

                if (-not $text.Contains($old)) {
                  throw 'The known yuvMatrix block no longer matches the expected fork source; refusing automatic conflict resolution.'
                }

                $text = $text.Replace($old, $new)
                Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding utf8
                git add -- Source/VideoRenderer.cpp

                $remaining = @(git diff --name-only --diff-filter=U)
                if ($remaining.Count -ne 0) {
                  throw "Known conflict resolver left unresolved paths: $($remaining -join ', ')"
                }

                git commit --no-edit
                if ($LASTEXITCODE -ne 0) {
                  throw 'Could not commit the resolved upstream merge.'
                }
              } else {
                git merge --abort
                throw 'Upstream merge produced conflicts outside the narrowly guarded known cases.'
              }
            }
          }

          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not synchronize submodule configuration after the upstream merge.'
          }

          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not update submodules after the upstream merge.'
          }

          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "upstream_sha=$upstreamSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Merged $pending upstream commit(s) through $upstreamSha." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build merged source
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) {
            throw "Merged source failed to build with exit code $LASTEXITCODE. Master was not updated."
          }

      - name: Push verified merge
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the verified upstream merge to master. A newer master commit may have arrived during the run.'
          }

      - name: Dispatch rolling build
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref master --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw 'The upstream merge was pushed, but the rolling master build could not be dispatched.'
          }

      - name: Record result
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          'The verified merge was pushed to master and a fresh rolling Maxine build was dispatched.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
