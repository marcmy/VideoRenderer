name: Sync upstream

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-upstream.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-2022

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Fetch and merge upstream
        id: merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Aleksoid1978/VideoRenderer master.'
          }

          $pending = [int](git rev-list --count HEAD..upstream/master)
          "pending=$pending" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($pending -eq 0) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'Already synchronized with upstream.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $upstreamSha = (git rev-parse upstream/master).Trim()
          $shortSha = $upstreamSha.Substring(0, 8)
          $originalHead = (git rev-parse HEAD).Trim()

          git merge --no-ff --no-edit -m "Merge Aleksoid1978/VideoRenderer upstream master ($shortSha)" upstream/master
          if ($LASTEXITCODE -ne 0) {
            $conflicts = @(git diff --name-only --diff-filter=U)

            $resolverBase = '94cec0788d03524ba8900859e3ccd901b0525e2f'
            $expectedUpstream = 'fbe023199b9c9ebf78c730ff9b85288a29bcca3c'

            git merge-base --is-ancestor $resolverBase $originalHead
            $forkLineageKnown = $LASTEXITCODE -eq 0
            $resolverDelta = @(git diff --name-only "$resolverBase..$originalHead")
            $onlyResolverChanges = @($resolverDelta | Where-Object { $_ -ne '.github/workflows/sync-upstream.yml' }).Count -eq 0
            $upstreamMatches = $upstreamSha -eq $expectedUpstream

            $knownConflict = $forkLineageKnown -and $onlyResolverChanges -and $upstreamMatches -and $conflicts.Count -eq 1 -and $conflicts[0] -eq 'Source/VideoRenderer.cpp'

            if ($knownConflict) {
              git checkout --ours -- Source/VideoRenderer.cpp
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not restore the fork side of the known VideoRenderer.cpp conflict.'
              }

              $path = 'Source/VideoRenderer.cpp'
              $text = Get-Content -Raw -LiteralPath $path
              $newline = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
              $old = @(
                "`telse if (!strcmp(field, `"yuvMatrix`")) {",
                "`t`tauto fmt = m_VideoProcessor->inputFormat();",
                "`t`tif (fmt.value != 0) {",
                "`t`t`tswitch (fmt.VideoTransferMatrix) {",
                "`t`t`t`tcase DXVA2_VideoTransferMatrix_BT709: str = L`"TV.709`"; break;",
                "`t`t`t`tcase MFVideoTransferMatrix_BT2020_10: str = L`"TV.2020`"; break;",
                "`t`t`t`tdefault: str = L`"TV.601`"; break;",
                "`t`t`t}",
                "`t`t} else {",
                "`t`t`tstr = L`"TV.709`";",
                "`t`t}",
                "`t}"
              ) -join $newline
              $new = @(
                "`telse if (!strcmp(field, `"yuvMatrix`")) {",
                "`t`tauto exFmt = m_VideoProcessor->getSrcExFormat();",
                "",
                "`t`tswitch (exFmt.VideoTransferMatrix) {",
                "`t`tdefault:",
                "`t`tcase DXVA2_VideoTransferMatrix_BT709: str = L`"TV.709`"; break;",
                "`t`tcase VIDEOTRANSFERMATRIX_FCC:",
                "`t`tcase DXVA2_VideoTransferMatrix_BT601: str = L`"TV.601`"; break;",
                "`t`tcase MFVideoTransferMatrix_BT2020_10: str = L`"TV.2020`"; break;",
                "`t`t}",
                "`t}"
              ) -join $newline

              if (-not $text.Contains($old)) {
                throw 'The known yuvMatrix block no longer matches the expected fork source; refusing automatic conflict resolution.'
              }

              $text = $text.Replace($old, $new)
              Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding utf8
              git add -- Source/VideoRenderer.cpp

              $remaining = @(git diff --name-only --diff-filter=U)
              if ($remaining.Count -ne 0) {
                throw "Known conflict resolver left unresolved paths: $($remaining -join ', ')"
              }

              git commit --no-edit
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not commit the resolved upstream merge.'
              }
            } else {
              git merge --abort
              throw 'Upstream merge produced conflicts outside the narrowly guarded known yuvMatrix API-update case.'
            }
          }

          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not synchronize submodule configuration after the upstream merge.'
          }

          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not update submodules after the upstream merge.'
          }

          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "upstream_sha=$upstreamSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Merged $pending upstream commit(s) through $upstreamSha." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build merged source
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) {
            throw "Merged source failed to build with exit code $LASTEXITCODE. Master was not updated."
          }

      - name: Push verified merge
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the verified upstream merge to master. A newer master commit may have arrived during the run.'
          }

      - name: Dispatch rolling build
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref master --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw 'The upstream merge was pushed, but the rolling master build could not be dispatched.'
          }

      - name: Record result
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          'The verified merge was pushed to master and a fresh rolling Maxine build was dispatched.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
