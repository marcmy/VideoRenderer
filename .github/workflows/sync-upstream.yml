name: Sync upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
      - name: Fetch and integrate upstream without source-specific conflict handlers
        id: merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) { throw 'Upstream fetch failed.' }
          $original=(git rev-parse HEAD).Trim()
          $upstream=(git rev-parse upstream/master).Trim()
          if ([int](git rev-list --count HEAD..upstream/master) -eq 0) {
            'changed=false' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            'No upstream changes; no merge, version bump or release.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          git merge --no-ff --no-commit upstream/master
          if ($LASTEXITCODE -ne 0) {
            New-Item -ItemType Directory -Force _artifacts/upstream-conflict | Out-Null
            git diff --binary | Out-File _artifacts/upstream-conflict/conflicts.patch -Encoding utf8
            git diff --name-only --diff-filter=U | Out-File _artifacts/upstream-conflict/files.txt -Encoding utf8
            git ls-files -u | Out-File _artifacts/upstream-conflict/unmerged-stages.txt -Encoding utf8
            "$original`n$upstream" | Out-File _artifacts/upstream-conflict/source-commits.txt -Encoding ascii
            $files=@(Get-Content _artifacts/upstream-conflict/files.txt | Where-Object { $_ })
            git merge --abort
            $title="Upstream merge needs review: $($upstream.Substring(0,12))"
            $fileList=($files | ForEach-Object { "- ``$_``" }) -join "`n"
            $runUrl="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $body="The scheduled three-way merge needs manual resolution. The verified fork master and its release were not changed.`n`nFork commit: $original`nUpstream commit: $upstream`n`nConflicting files:`n$fileList`n`n[Sync run and downloadable conflict artifact]($runUrl)`n`nResolve against the current fork master, preserve fork functionality, run both architecture builds and regressions, and submit a reviewable integration PR."
            $existing=@(gh issue list --repo marcmy/VideoRenderer --state open --limit 200 --json number,title | ConvertFrom-Json | Where-Object { $_.title -eq $title })
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing upstream integration issues; conflict artifacts are preserved.' }
            if ($existing.Count -eq 0) {
              gh issue create --repo marcmy/VideoRenderer --title $title --body $body
              if ($LASTEXITCODE -ne 0) { throw 'Could not create the upstream integration issue; conflict artifacts are preserved.' }
            }
            throw 'Unknown upstream conflict requires review; the issue and CI conflict artifact identify the required integration.'
          }
          ./tools/Dev/Version.ps1 -RecordUpstream $upstream
          git add upstream.version.json
          git commit -m "Merge upstream VideoRenderer $($upstream.Substring(0,12))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the verified upstream identity.' }
          "original=$original" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          'changed=true' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build both architectures and run regression tests on the merged source
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./dev.ps1 build -Architecture both -Flavor release
          ./dev.ps1 test
      - name: Publish the verified merge and explicitly trigger the versioned release
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL: ${{ steps.merge.outputs.original }}
        run: |
          $remote=(git ls-remote origin refs/heads/master).Split()[0]
          if ($remote -ne $env:ORIGINAL) { throw 'Fork master advanced during validation; no merge was pushed.' }
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { throw 'Normal fast-forward push rejected; preserve and reconcile the newer source.' }
          gh workflow run main.yml --repo marcmy/VideoRenderer --ref master
          if ($LASTEXITCODE -ne 0) { throw 'Merged source pushed, but release dispatch failed; rerun main.yml on master.' }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: upstream-integration-review
          path: _artifacts/upstream-conflict/
          if-no-files-found: ignore
