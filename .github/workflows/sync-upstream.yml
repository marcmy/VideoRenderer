name: Sync upstream

on:
  push:
    branches:
      - test/maxine-resize-debounce-nvof
    paths:
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync-test-maxine-nvof
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-2022

    steps:
      - name: Checkout test Maxine/NVOF branch
        uses: actions/checkout@v7
        with:
          ref: test/maxine-resize-debounce-nvof
          fetch-depth: 0
          submodules: recursive

      - name: Fetch and merge upstream
        id: merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Aleksoid1978/VideoRenderer master.'
          }

          $pending = [int](git rev-list --count HEAD..upstream/master)
          "pending=$pending" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($pending -eq 0) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'Already synchronized with upstream.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $upstreamSha = (git rev-parse upstream/master).Trim()
          $shortSha = $upstreamSha.Substring(0, 8)

          # This branch intentionally carries extensive custom renderer work.
          # Prefer upstream only for genuinely conflicting hunks while preserving
          # all non-conflicting Maxine/NVOF changes from the branch.
          git merge --no-ff --no-edit -X theirs -m "Merge Aleksoid1978/VideoRenderer upstream master ($shortSha)" upstream/master
          if ($LASTEXITCODE -ne 0) {
            git merge --abort
            throw 'Upstream merge still produced unresolved conflicts and requires manual resolution.'
          }

          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not synchronize submodule configuration after the upstream merge.'
          }

          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not update submodules after the upstream merge.'
          }

          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "upstream_sha=$upstreamSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Merged $pending upstream commit(s) through $upstreamSha." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build merged source
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) {
            throw "Merged source failed to build with exit code $LASTEXITCODE. The test branch was not updated."
          }

      - name: Push verified merge
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          git push origin HEAD:test/maxine-resize-debounce-nvof
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the verified upstream merge to the test branch. A newer branch commit may have arrived during the run.'
          }

      - name: Record result
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          'The verified upstream merge was pushed to test/maxine-resize-debounce-nvof. Its normal build workflow will package a fresh K-Lite setup artifact.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
