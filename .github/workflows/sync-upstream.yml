name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-2022

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Fetch and merge upstream
        id: merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Aleksoid1978/VideoRenderer master.'
          }

          $pending = [int](git rev-list --count HEAD..upstream/master)
          "pending=$pending" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($pending -eq 0) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'Already synchronized with upstream.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $upstreamSha = (git rev-parse upstream/master).Trim()
          $shortSha = $upstreamSha.Substring(0, 8)

          git merge --no-ff --no-edit -m "Merge Aleksoid1978/VideoRenderer upstream master ($shortSha)" upstream/master
          if ($LASTEXITCODE -ne 0) {
            $knownUpstream = '95502cdb92ad3f4b3842acc4f0d8f58aeb799f3c'
            $conflicts = @(git diff --name-only --diff-filter=U)
            if ($upstreamSha -ne $knownUpstream -or $conflicts.Count -ne 1 -or $conflicts[0] -ne 'Source/DX11VideoProcessor.cpp') {
              git merge --abort
              throw "Upstream merge produced unexpected conflicts: $($conflicts -join ', ')"
            }

            git checkout --ours -- Source/DX11VideoProcessor.cpp
            $path = 'Source/DX11VideoProcessor.cpp'
            $text = [IO.File]::ReadAllText($path)
            $lf = $text.Replace("`r`n", "`n")
            $old = @(
              "`tauto superRes = (m_bVPScaling && m_iMaxineOperation == MAXINE_OPERATION_Disabled && m_InternalTexFmt == DXGI_FORMAT_B8G8R8A8_UNORM && (params.CDepth == 8 || !m_bACMEnabled))",
              "`t`t? m_iVPSuperRes : SUPERRES_Disable;",
              "`tm_bVPUseSuperRes = (m_D3D11VP.SetSuperRes(superRes) == S_OK);",
              '',
              "`tauto rtxHDR = m_bVPRTXVideoHDR && m_bHdrPassthroughSupport && m_bHdrPassthrough && m_iTexFormat != TEXFMT_8INT && !SourceIsHDR();",
              "`tm_bVPUseRTXVideoHDR = (m_D3D11VP.SetRTXVideoHDR(rtxHDR) == S_OK);"
            ) -join "`n"
            $new = @(
              "`tauto rtxHDR = m_bVPRTXVideoHDR && m_bHdrPassthroughSupport && m_bHdrPassthrough && m_iTexFormat != TEXFMT_8INT && !SourceIsHDR();",
              "`tm_bVPUseRTXVideoHDR = (m_D3D11VP.SetRTXVideoHDR(rtxHDR) == S_OK);",
              '',
              "`tauto superRes = (m_bVPScaling && m_iMaxineOperation == MAXINE_OPERATION_Disabled",
              "`t`t`t&& (m_InternalTexFmt == DXGI_FORMAT_B8G8R8A8_UNORM || m_bVPUseRTXVideoHDR)",
              "`t`t`t&& (params.CDepth == 8 || !m_bACMEnabled)) ? m_iVPSuperRes : SUPERRES_Disable;",
              "`tm_bVPUseSuperRes = (m_D3D11VP.SetSuperRes(superRes) == S_OK);"
            ) -join "`n"
            if (-not $lf.Contains($old) -or $lf.IndexOf($old) -ne $lf.LastIndexOf($old)) {
              git merge --abort
              throw 'Known fork-side Super Resolution/RTX HDR block was not found exactly once; refusing unsafe resolution.'
            }
            $resolved = $lf.Replace($old, $new)
            [IO.File]::WriteAllText($path, $resolved.Replace("`n", "`r`n"), [Text.UTF8Encoding]::new($false))
            git add Source/DX11VideoProcessor.cpp
            $remaining = @(git diff --name-only --diff-filter=U)
            if ($remaining.Count -ne 0) {
              git merge --abort
              throw "Unresolved conflicts remain: $($remaining -join ', ')"
            }
            git commit --no-edit
            if ($LASTEXITCODE -ne 0) {
              git merge --abort
              throw 'Could not commit the exact upstream conflict resolution.'
            }
          }

          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not synchronize submodule configuration after the upstream merge.'
          }

          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not update submodules after the upstream merge.'
          }

          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "upstream_sha=$upstreamSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Merged $pending upstream commit(s) through $upstreamSha." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build merged source
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) {
            throw "Merged source failed to build with exit code $LASTEXITCODE. Master was not updated."
          }

      - name: Push verified merge
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the verified upstream merge to master. A newer master commit may have arrived during the run.'
          }

      - name: Dispatch rolling build
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref master --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw 'The upstream merge was pushed, but the rolling master build could not be dispatched.'
          }

      - name: Record result
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          'The verified merge was pushed to master and a fresh rolling Maxine build was dispatched.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
