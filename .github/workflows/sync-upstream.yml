name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-2022

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Fetch and merge upstream
        id: merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Aleksoid1978/VideoRenderer master.'
          }

          $pending = [int](git rev-list --count HEAD..upstream/master)
          "pending=$pending" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($pending -eq 0) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'Already synchronized with upstream.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $upstreamSha = (git rev-parse upstream/master).Trim()
          $shortSha = $upstreamSha.Substring(0, 8)

          git merge --no-ff --no-edit -m "Merge Aleksoid1978/VideoRenderer upstream master ($shortSha)" upstream/master
          if ($LASTEXITCODE -ne 0) {
            $unmerged = @(git diff --name-only --diff-filter=U)
            if ($upstreamSha -eq '77fd16e6e9b3e794b53da0253c6abfff990c16df' -and
                $unmerged.Count -eq 1 -and
                $unmerged[0] -eq 'Source/DX11VideoProcessor.cpp') {
              git checkout --ours -- Source/DX11VideoProcessor.cpp
              $path = 'Source/DX11VideoProcessor.cpp'
              $text = Get-Content -Raw -Path $path
              $old = "auto superRes = (m_bVPScaling && m_iMaxineOperation == MAXINE_OPERATION_Disabled && (params.CDepth == 8 || !m_bACMEnabled))"
              $new = "auto superRes = (m_bVPScaling && m_iMaxineOperation == MAXINE_OPERATION_Disabled && m_InternalTexFmt == DXGI_FORMAT_B8G8R8A8_UNORM && (params.CDepth == 8 || !m_bACMEnabled))"
              if (-not $text.Contains($old)) {
                git merge --abort
                throw 'Expected local SuperRes expression was not found; refusing automatic conflict resolution.'
              }
              $text = $text.Replace($old, $new)
              [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))
              git add -- Source/DX11VideoProcessor.cpp
              git commit --no-edit
              if ($LASTEXITCODE -ne 0) {
                git merge --abort
                throw 'Could not commit the guarded SuperRes conflict resolution.'
              }
              'Resolved the known upstream SuperRes conflict while preserving the fork Maxine exclusion.' |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            else {
              git merge --abort
              throw 'Upstream merge produced conflicts and requires manual resolution.'
            }
          }

          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not synchronize submodule configuration after the upstream merge.'
          }

          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not update submodules after the upstream merge.'
          }

          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "upstream_sha=$upstreamSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Merged $pending upstream commit(s) through $upstreamSha." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build merged source
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) {
            throw "Merged source failed to build with exit code $LASTEXITCODE. Master was not updated."
          }

      - name: Push verified merge
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the verified upstream merge to master. A newer master commit may have arrived during the run.'
          }

      - name: Dispatch rolling build
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --ref master --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw 'The upstream merge was pushed, but the rolling master build could not be dispatched.'
          }

      - name: Record result
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          'The verified merge was pushed to master and a fresh rolling Maxine build was dispatched.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
