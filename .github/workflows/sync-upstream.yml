name: Sync upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
      - name: Fetch and integrate upstream without source-specific conflict handlers
        id: merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) { throw 'Upstream fetch failed.' }
          $original=(git rev-parse HEAD).Trim()
          $upstream=(git rev-parse upstream/master).Trim()
          if ([int](git rev-list --count HEAD..upstream/master) -eq 0) {
            'changed=false' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            'No upstream changes; no merge, version bump or release.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          git merge -Xrenormalize --no-ff --no-commit upstream/master
          if ($LASTEXITCODE -ne 0) {
            '::warning::Upstream merge has conflicts; opening a pull request to resolve them.'
            git diff --name-only --diff-filter=U
            git merge --abort
            "original=$original" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            'conflict=true' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          ./tools/Dev/Version.ps1 -RecordUpstream $upstream
          git add upstream.version.json
          git commit -m "Merge upstream VideoRenderer $($upstream.Substring(0,12))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the verified upstream identity.' }
          "original=$original" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          'changed=true' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build both architectures and run regression tests on the merged source
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./dev.ps1 build -Architecture both -Flavor release
          ./dev.ps1 test
      - name: Publish the verified merge and explicitly trigger the versioned release
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL: ${{ steps.merge.outputs.original }}
        run: |
          $remote=(git ls-remote origin refs/heads/master).Split()[0]
          if ($remote -ne $env:ORIGINAL) { throw 'Fork master advanced during validation; no merge was pushed.' }
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { throw 'Normal fast-forward push rejected; preserve and reconcile the newer source.' }
          gh workflow run main.yml --repo marcmy/VideoRenderer --ref master
          if ($LASTEXITCODE -ne 0) { throw 'Merged source pushed, but release dispatch failed; rerun main.yml on master.' }
      - name: Open conflict pull request
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          FORK_BRANCH: master
          BASE_SHA: ${{ steps.merge.outputs.original }}
          UPSTREAM_REF: upstream/master
          UPSTREAM_NAME: Aleksoid1978/VideoRenderer@master
          KEEP_FORK_PATHS: .github/workflows
          MERGE_OPTS: -Xrenormalize
          PR_NOTE: >-
            After this PR is merged, the next **Sync upstream** run won't build or release it, because master
            already contains upstream. Run `main.yml` on master by hand to build both architectures and release.
        # Windows checkouts may convert the script to CRLF, which bash can't run
        run: |
          tr -d '\r' < .github/scripts/sync-conflict-pr.sh > "$RUNNER_TEMP/sync-conflict-pr.sh"
          bash "$RUNNER_TEMP/sync-conflict-pr.sh"
