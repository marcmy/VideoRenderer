name: Native NVOF capability hardening

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-native-nvof-capability-hardening.ps1
      - .github/workflows/native-nvof-capability-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply production capability hardening
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-native-nvof-capability-hardening.ps1
