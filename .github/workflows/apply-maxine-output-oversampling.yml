name: Apply Maxine output oversampling

on:
  push:
    branches:
      - feature/maxine-output-oversampling
    paths:
      - .github/workflows/apply-maxine-output-oversampling.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/maxine-output-oversampling
          fetch-depth: 0

      - name: Apply focused source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path_name):
              path = Path(path_name)
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig').replace('\r\n', '\n')
              newline = '\r\n' if b'\r\n' in raw else '\n'
              return path, text, newline, bom

          def save(path, text, newline, bom):
              data = text.replace('\n', newline).encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              path.write_bytes(data)

          def replace_once(path_name, old, new):
              path, text, newline, bom = load(path_name)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one match, found {count}: {old[:100]!r}')
              save(path, text.replace(old, new), newline, bom)

          def regex_once(path_name, pattern, replacement):
              path, text, newline, bom = load(path_name)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one regex match, found {count}: {pattern!r}')
              save(path, updated, newline, bom)

          replace_once('Source/IVideoRenderer.h', '''enum :int {
          \tMAXINE_SCALE_MatchOutput = 0,
          \tMAXINE_SCALE_4_3X = 133,
          \tMAXINE_SCALE_1_5X = 150,
          \tMAXINE_SCALE_2X = 200,
          \tMAXINE_SCALE_3X = 300,
          \tMAXINE_SCALE_4X = 400,
          };
          
          enum :int {
          \tMAXINE_FILTER_Off = 0,
          ''', '''enum :int {
          \tMAXINE_SCALE_MatchOutput = 0,
          \tMAXINE_SCALE_4_3X = 133,
          \tMAXINE_SCALE_1_5X = 150,
          \tMAXINE_SCALE_2X = 200,
          \tMAXINE_SCALE_3X = 300,
          \tMAXINE_SCALE_4X = 400,
          };
          
          enum :int {
          \tMAXINE_OVERSAMPLE_Off = 100,
          \tMAXINE_OVERSAMPLE_4_3X = 133,
          \tMAXINE_OVERSAMPLE_1_5X = 150,
          \tMAXINE_OVERSAMPLE_2X = 200,
