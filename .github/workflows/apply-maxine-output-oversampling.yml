          replace_once('Source/MpcVideoRenderer.rc', '''    IDD_MAXINESETTINGS, DIALOG
              BEGIN
                  LEFTMARGIN, 7
                  RIGHTMARGIN, 297
                  TOPMARGIN, 7
                  BOTTOMMARGIN, 242
              END
          ''', '''    IDD_MAXINESETTINGS, DIALOG
              BEGIN
                  LEFTMARGIN, 7
                  RIGHTMARGIN, 297
                  TOPMARGIN, 7
