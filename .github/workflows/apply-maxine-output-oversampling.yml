          \tint iMaxineSourceLimit;
          ''', '''\tint iMaxineQuality;
          \tint iMaxineScale;
          \tint iMaxineOversample;
          \tint iMaxineSourceLimit;
          ''')
          replace_once('Source/IVideoRenderer.h', '''\t\tiMaxineQuality                  = MAXINE_QUALITY_High;
          \t\tiMaxineScale                    = MAXINE_SCALE_MatchOutput;
          \t\tiMaxineSourceLimit              = SUPERRES_1080p;
          ''', '''\t\tiMaxineQuality                  = MAXINE_QUALITY_High;
