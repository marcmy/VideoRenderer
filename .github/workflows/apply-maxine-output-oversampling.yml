          \t\ttargetWidth = (static_cast<unsigned long long>(dstWidth) * oversample + 50ull) / 100ull;
          \t\ttargetHeight = (static_cast<unsigned long long>(dstHeight) * oversample + 50ull) / 100ull;
          
          \t\tconst unsigned long long maxWidth = static_cast<unsigned long long>(m_srcRectWidth) * 4ull;
          \t\tconst unsigned long long maxHeight = static_cast<unsigned long long>(m_srcRectHeight) * 4ull;
          \t\tif (targetWidth > maxWidth || targetHeight > maxHeight) {
          \t\t\tconst long double scaleX = static_cast<long double>(maxWidth) / targetWidth;
          \t\t\tconst long double scaleY = static_cast<long double>(maxHeight) / targetHeight;
          \t\t\tconst long double scale = std::min(scaleX, scaleY);
          \t\t\ttargetWidth = std::min(maxWidth, std::max<unsigned long long>(m_srcRectWidth,
          \t\t\t\tstatic_cast<unsigned long long>(std::llround(targetWidth * scale))));
          \t\t\ttargetHeight = std::min(maxHeight, std::max<unsigned long long>(m_srcRectHeight,
          \t\t\t\tstatic_cast<unsigned long long>(std::llround(targetHeight * scale))));
          \t\t\tm_bMaxineOversampleClamped = true;
          \t\t}
          \t}
          ''')
