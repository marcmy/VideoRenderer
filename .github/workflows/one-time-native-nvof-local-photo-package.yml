name: One-time native NVOF local-photo package

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-native-nvof-local-photo-package.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build validated source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MPCVR test package
        uses: actions/upload-artifact@v7
        with:
          name: MPCVR native NVOF local-photo-guard test
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0

      - name: Remove packaging workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/one-time-native-nvof-local-photo-package.yml
          git commit -m "Package local-photo NVOF test (run $env:GITHUB_RUN_ID)"
          git push origin HEAD:feature/native-nvof-interpolation
