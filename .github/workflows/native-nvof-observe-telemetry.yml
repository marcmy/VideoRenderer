name: Native NVOF observe-only telemetry integration

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-native-nvof-observe-telemetry-v2.ps1
      - .github/workflows/native-nvof-observe-telemetry.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make regional detector observe-only and add telemetry
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-native-nvof-observe-telemetry-v2.ps1
