name: Native NVOF observe-only telemetry integration

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-native-nvof-observe-telemetry-v4.ps1
      - .github/workflows/native-nvof-observe-telemetry.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply observe-only telemetry source patch
        continue-on-error: true
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-native-nvof-observe-telemetry-v4.ps1

      - name: Finalize status tokens, bytecode, and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Source/NvidiaOpticalFlowNative.cpp'
          $text = ([IO.File]::ReadAllText($path) -replace "`r`n", "`n")

          $anchor = "`t`tpreviousTimestamp = inputTimestamp;`n`t`tstatus = std::format("
          $replacement = "`t`tpreviousTimestamp = inputTimestamp;`n`t`tconst std::wstring telemetry = denseSynthesizer`n`t`t`t? denseSynthesizer->GetTelemetryText()`n`t`t`t: L`"quality telemetry unavailable`";`n`t`tstatus = std::format("
          if (-not $text.Contains($anchor)) { throw 'Native status insertion point not found.' }
          $text = $text.Replace($anchor, $replacement)

          $oldFormat = 'L"Native NVOF active ({:.2f} ms submit, t={:.3f})",'
          $newFormat = 'L"Native NVOF active ({:.2f} ms submit, t={:.3f}); {}",'
          if (-not $text.Contains($oldFormat)) { throw 'Native status format token not found.' }
          $text = $text.Replace($oldFormat, $newFormat)

          $oldArgs = "`t`t`tprocessTimeMs, midpointTime);"
          $newArgs = "`t`t`tprocessTimeMs, midpointTime, telemetry);"
          if (-not $text.Contains($oldArgs)) { throw 'Native status argument token not found.' }
          $text = $text.Replace($oldArgs, $newArgs)
          [IO.File]::WriteAllText($path, $text)

          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }
          $specs = @(
            @{ Source='Source/NvidiaOpticalFlowDenseRegionGate.hlsl'; Header='Source/NvidiaOpticalFlowDenseRegionGateBytecode.h'; Name='g_NvofDenseRegionGateBytecode' },
            @{ Source='Source/NvidiaOpticalFlowDenseWarp.hlsl'; Header='Source/NvidiaOpticalFlowDenseWarpBytecode.h'; Name='g_NvofDenseWarpBytecode' }
          )
          foreach ($spec in $specs) {
            & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh $spec.Header /Vn $spec.Name $spec.Source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Source/NvidiaOpticalFlowDenseRegionGate.hlsl Source/NvidiaOpticalFlowDenseWarp.hlsl Source/NvidiaOpticalFlowDenseRegionGateBytecode.h Source/NvidiaOpticalFlowDenseWarpBytecode.h Source/NvidiaOpticalFlowDenseSynthesizer.h Source/NvidiaOpticalFlowDenseSynthesizer.cpp Source/NvidiaOpticalFlowNative.cpp
          git commit -m 'Make regional NVOF detector observe-only with telemetry'
          git push origin HEAD:feature/native-nvof-interpolation
