name: Native NVOF observe-only telemetry integration

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-native-nvof-observe-telemetry.ps1
      - .github/workflows/native-nvof-observe-telemetry.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize patch-target line endings
        shell: pwsh
        run: |
          $paths = @(
            'Source/NvidiaOpticalFlowDenseRegionGate.hlsl',
            'Source/NvidiaOpticalFlowDenseWarp.hlsl',
            'Source/NvidiaOpticalFlowDenseSynthesizer.h',
            'Source/NvidiaOpticalFlowDenseSynthesizer.cpp',
            'Source/NvidiaOpticalFlowNative.cpp'
          )
          foreach ($path in $paths) {
            $text = [IO.File]::ReadAllText($path) -replace "`r`n", "`n"
            [IO.File]::WriteAllText($path, $text)
          }

      - name: Make regional detector observe-only and add telemetry
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-native-nvof-observe-telemetry.ps1
