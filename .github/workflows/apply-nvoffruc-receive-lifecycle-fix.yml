name: Apply NvOFFRUC receive lifecycle fix

on:
  push:
    branches: [fix/nvoffruc-seek-freeze]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nvoffruc-seek-freeze
          fetch-depth: 0
      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/nvoffruc-receive-lifecycle-fix.patch.gz.b64 | gzip -d > /tmp/nvoffruc-receive-lifecycle-fix.patch
          echo '4ce319771cf54022baeab3338c3f9532fc6ee78ff9294c831530025199b5304d  /tmp/nvoffruc-receive-lifecycle-fix.patch' | sha256sum -c -
          git apply --check /tmp/nvoffruc-receive-lifecycle-fix.patch
          git apply /tmp/nvoffruc-receive-lifecycle-fix.patch
          rm -f .github/nvoffruc-receive-lifecycle-fix.patch.gz.b64
          rm -f .github/workflows/apply-nvoffruc-receive-lifecycle-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align FRUC receive locking with DirectShow flush lifecycle'
          git push origin HEAD:fix/nvoffruc-seek-freeze
