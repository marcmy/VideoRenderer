name: Native NVOF regional threshold tuning

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-native-nvof-region-threshold.ps1
      - .github/workflows/native-nvof-region-threshold.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tighten regional whole-frame rejection threshold
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-native-nvof-region-threshold.ps1
