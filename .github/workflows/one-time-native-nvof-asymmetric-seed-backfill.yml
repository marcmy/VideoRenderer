name: One-time native NVOF asymmetric seed backfill

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-native-nvof-asymmetric-seed-backfill.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch asymmetric seed backfill
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/one-time-nvof-asymmetric-seed-backfill.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }

          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh Source/NvidiaOpticalFlowDenseSeedBytecode.h /Vn g_NvofDenseSeedBytecode Source/NvidiaOpticalFlowDenseSeed.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh Source/NvidiaOpticalFlowDenseJumpBytecode.h /Vn g_NvofDenseJumpBytecode Source/NvidiaOpticalFlowDenseJump.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh Source/NvidiaOpticalFlowDenseUpsampleBytecode.h /Vn g_NvofDenseUpsampleBytecode Source/NvidiaOpticalFlowDenseUpsample.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MPCVR test package
        uses: actions/upload-artifact@v7
        with:
          name: MPCVR native NVOF asymmetric seed backfill test
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0

      - name: Commit validated seed backfill
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            Source/NvidiaOpticalFlowDenseSeed.hlsl `
            Source/NvidiaOpticalFlowDenseSeedBytecode.h `
            Source/NvidiaOpticalFlowDenseJump.hlsl `
            Source/NvidiaOpticalFlowDenseJumpBytecode.h `
            Source/NvidiaOpticalFlowDenseUpsample.hlsl `
            Source/NvidiaOpticalFlowDenseUpsampleBytecode.h `
            Source/NvidiaOpticalFlowDenseSynthesizer.cpp
          git rm -- .github/scripts/one-time-nvof-asymmetric-seed-backfill.py
          git rm -- .github/workflows/one-time-native-nvof-asymmetric-seed-backfill.yml
          git commit -m 'Backfill dense NVOF seeds from trustworthy reverse flow'
          git push origin HEAD:feature/native-nvof-interpolation
