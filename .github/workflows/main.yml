name: Build and release renderer
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Fetch upstream version history
        shell: pwsh
        run: |
          git remote add upstream https://github.com/Aleksoid1978/VideoRenderer.git
          git fetch --no-tags upstream master
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify pinned dependencies without downloading runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/Dev/dependencies.py check --lock dependencies.lock.json --published
      - name: Build x86 and x64 and verify compiled version resources
        shell: pwsh
        run: ./dev.ps1 build -Architecture both -Flavor auto
      - name: CPU, WARP, ABI, scheduler, lifecycle, cache, scene, precision and dialog regressions
        shell: pwsh
        run: ./dev.ps1 test
      - name: Package small renderer and setup artifacts
        shell: pwsh
        run: python tools/Dev/release.py package --version _bin/source-version.json --architecture both --output _artifacts/release
      - name: Validate the lightweight setup offline
        shell: pwsh
        run: |
          Expand-Archive _artifacts/release/MPCVR-Setup.zip _artifacts/setup-validation
          foreach ($hostName in @('powershell.exe','pwsh.exe')) {
            & $hostName -NoLogo -NoProfile -ExecutionPolicy Bypass -File _artifacts/setup-validation/Install-MPCVR-Maxine-RIFE.ps1 -ValidateOnly -NoPause
            if ($LASTEXITCODE -ne 0) { throw 'Lightweight setup validation failed.' }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: renderer-release
          path: _artifacts/release/
          compression-level: 0
          if-no-files-found: error
  validate-updater:
    uses: ./.github/workflows/validate-klite-updater.yml
  validate-maxine-installer:
    uses: ./.github/workflows/validate-maxine-runtime-installer.yml
  validate-rife-installer:
    uses: ./.github/workflows/validate-rife-runtime-installer.yml
  publish:
    needs: [build, validate-updater, validate-maxine-installer, validate-rife-installer]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: renderer-release-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: renderer-release
          path: release
      - name: Verify and publish this source revision, then guard latest promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/Dev/release.py publish --directory release
