name: Build VideoRenderer

on:
  push:
    paths-ignore:
      - '**.txt'
      - '**.md'
      - '**.vcxproj.filters'
  pull_request:
    paths-ignore:
      - '**.txt'
      - '**.md'
      - '**.vcxproj.filters'
  workflow_dispatch:

permissions:
  contents: read

env:
  RIFE_MINIMUM_COMMIT: 5163915f42acca926b748c0f3b537eb685e76e76
  MAXINE_LICENSE_URL: https://developer.nvidia.com/downloads/maxine-sdk-license
  MAXINE_LICENSE_SHA256: 3749955ea638199e317d87261512dc9baa6d4d4be424f21a1f9b609e54154703

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Test RIFE scheduler
        run: .\tools\rife-scheduler-test\build-test.cmd
        shell: cmd

      - name: Test RIFE receive pacing
        run: python .\tools\rife-receive-pacing-test\test_receive_pacing.py

      - name: Test RIFE runtime ABI
        run: .\tools\rife-runtime-abi-test\build-test.cmd
        shell: cmd

      - name: Test RIFE lifecycle
        run: python .\tools\rife-lifecycle-test\test_rife_lifecycle.py

      - name: Build VideoRenderer
        run: |
          .\build_mpcvr.cmd NoWait
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "MPC Video Renderer"
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0
          if-no-files-found: error

  rife-runtime:
    uses: ./.github/workflows/rife-runtime.yml

  rife-model:
    uses: ./.github/workflows/rife-model.yml

  publish-maxine:
    name: Publish latest Maxine + RIFE build
    needs: [build, rife-runtime, rife-model]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert release ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RIFE_MINIMUM_COMMIT" "$GITHUB_SHA"

      - name: Download renderer artifact
        uses: actions/download-artifact@v8
        with:
          name: "MPC Video Renderer"
          path: release/renderer-artifact

      - name: Download RIFE runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: mpcvr-rife-runtime-bundle
          path: release/rife-runtime

      - name: Download RIFE model artifact
        uses: actions/download-artifact@v8
        with:
          name: mpcvr-rife-v4.6-model
          path: release/rife-model

      - name: Prepare release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package="$(find release/renderer-artifact -maxdepth 1 -type f -name 'MpcVideoRenderer*.zip' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "No MPC Video Renderer package was found in the build artifact." >&2
            exit 1
          fi
          cp "$package" release/MpcVideoRenderer-Maxine-RIFE.zip

          runtime_artifact='release/rife-runtime'
          model_artifact='release/rife-model'
          runtime_sums="$runtime_artifact/SHA256SUMS.txt"
          model_sums="$model_artifact/SHA256SUMS.txt"
          if [[ ! -f "$runtime_sums" || ! -f "$model_sums" ]]; then
            echo "RIFE runtime/model artifact checksums are missing." >&2
            exit 1
          fi
          (
            cd "$runtime_artifact"
            sha256sum --check --strict SHA256SUMS.txt
          )
          (
            cd "$model_artifact"
            sha256sum --check --strict SHA256SUMS.txt
          )

          for file in \
            MPCVR-RIFE-Common.zip \
            MPCVR-RIFE-sm75.zip \
            MPCVR-RIFE-sm86.zip \
            MPCVR-RIFE-sm89.zip \
            MPCVR-RIFE-sm120.zip \
            runtime-manifest.json; do
            if [[ ! -f "$runtime_artifact/$file" ]]; then
              echo "RIFE runtime artifact is missing $file." >&2
              exit 1
            fi
          done
          for file in \
            MPCVR-RIFE-Model-v4.6.zip \
            rife_v4.6.onnx \
            model-manifest.json \
            SOURCE.txt \
            LICENSES/RIFE-model-license.txt; do
            if [[ ! -f "$model_artifact/$file" ]]; then
              echo "RIFE model artifact is missing $file." >&2
              exit 1
            fi
          done

          mkdir -p release/runtime-source

          # Carry the previously verified Maxine runtime forward. Prefer the
          # Maxine + RIFE setup, then its compatibility alias, then legacy
          # standalone runtime assets for the first migration release.
          mkdir -p release/previous-setup
          runtime_zip='release/runtime-source/MPCVR-Maxine-Runtime.zip'
          runtime_expected=''
          for setup_asset in MPCVR-Maxine-RIFE-Setup.zip MPCVR-Maxine-Setup.zip; do
            rm -rf release/previous-setup/*
            if gh release download \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$setup_asset" \
                --dir release/previous-setup; then
              previous_setup="$(find release/previous-setup -maxdepth 1 -type f -name "$setup_asset" -print -quit)"
              if [[ -n "$previous_setup" ]] && unzip -p "$previous_setup" 'payload/MPCVR-Maxine-Runtime.zip' > "$runtime_zip"; then
                if unzip -p "$previous_setup" 'payload/PAYLOAD-SHA256SUMS.txt' > release/runtime-source/PAYLOAD-SHA256SUMS.txt 2>/dev/null; then
                  runtime_expected="$(awk '$2 ~ /(^|\/)MPCVR-Maxine-Runtime\.zip$/ {print tolower($1); exit}' release/runtime-source/PAYLOAD-SHA256SUMS.txt)"
                fi
                if [[ -z "$runtime_expected" ]] && unzip -p "$previous_setup" 'payload/MPCVR-Maxine-Runtime.zip.sha256' > release/runtime-source/MPCVR-Maxine-Runtime.zip.sha256 2>/dev/null; then
                  runtime_expected="$(awk '{print tolower($1); exit}' release/runtime-source/MPCVR-Maxine-Runtime.zip.sha256)"
                fi
                if [[ -n "$runtime_expected" ]]; then
                  break
                fi
              fi
            fi
          done

          if [[ ! -f "$runtime_zip" || -z "$runtime_expected" ]]; then
            echo "No embedded runtime was found; trying the legacy standalone release assets."
            rm -f "$runtime_zip" release/runtime-source/MPCVR-Maxine-Runtime.zip.sha256
            gh release download \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'MPCVR-Maxine-Runtime.zip' \
              --pattern 'MPCVR-Maxine-Runtime.zip.sha256' \
              --dir release/runtime-source
            runtime_expected="$(awk '{print tolower($1); exit}' release/runtime-source/MPCVR-Maxine-Runtime.zip.sha256)"
          fi

          if [[ ! -f "$runtime_zip" || -z "$runtime_expected" ]]; then
            echo "A verified Maxine runtime bundle is required to publish the unified setup." >&2
            exit 1
          fi

          actual="$(sha256sum "$runtime_zip" | awk '{print tolower($1)}')"
          if [[ ! "$runtime_expected" =~ ^[a-f0-9]{64}$ || "$actual" != "$runtime_expected" ]]; then
            echo "The carried Maxine runtime checksum did not verify." >&2
            exit 1
          fi
          echo "Verified the carried Maxine runtime bundle: $actual"

          maxine_license='release/runtime-source/Maxine-SDK-License.pdf'
          curl --fail --location --silent --show-error \
            "$MAXINE_LICENSE_URL" \
            --output "$maxine_license"
          echo "$MAXINE_LICENSE_SHA256  $maxine_license" | sha256sum --check --strict
          if [[ "$(head -c 5 "$maxine_license")" != '%PDF-' ]]; then
            echo "The pinned Maxine SDK license download is not a PDF." >&2
            exit 1
          fi

          setup_root='release/setup-root'
          payload_root="$setup_root/payload"
          mkdir -p "$payload_root/LICENSES"

          cp tools/MaxineSetup/Install-MPCVR-Maxine-RIFE.cmd "$setup_root/"
          cp tools/MaxineSetup/Install-MPCVR-Maxine-RIFE.ps1 "$setup_root/"
          cp tools/MaxineSetup/Install-MPCVR-Maxine.cmd "$setup_root/"
          cp tools/MaxineSetup/Install-MPCVR-Maxine.ps1 "$setup_root/"
          cp tools/MaxineSetup/README.md "$setup_root/README.md"

          cp tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1 "$payload_root/"
          cp tools/RifeRuntimeInstaller/Install-MPCVRRifeRuntime.ps1 "$payload_root/"
          cp tools/RifeRuntimeInstaller/Test-MPCVRRifePreflight.ps1 "$payload_root/"
          cp tools/RifeRuntimeInstaller/RifeRuntimeManifest.psm1 "$payload_root/"
          cp tools/KLiteMaxineUpdater/Install-KLiteMPCVRUpdater.ps1 "$payload_root/"
          cp tools/KLiteMaxineUpdater/Update-KLiteMPCVR.ps1 "$payload_root/"
          cp tools/KLiteMaxineUpdater/KLiteRendererInstall.psm1 "$payload_root/"
          cp tools/MaxineSetup/THIRD-PARTY-NOTICES.txt "$payload_root/"

          cp release/MpcVideoRenderer-Maxine-RIFE.zip "$payload_root/"
          cp "$runtime_zip" "$payload_root/"
          cp "$runtime_artifact/MPCVR-RIFE-Common.zip" "$payload_root/"
          cp "$runtime_artifact/runtime-manifest.json" "$payload_root/RIFE-runtime-manifest.json"
          cp "$runtime_sums" "$payload_root/RIFE-runtime-SHA256SUMS.txt"
          cp "$model_artifact/MPCVR-RIFE-Model-v4.6.zip" "$payload_root/"
          cp "$model_artifact/LICENSES/RIFE-model-license.txt" "$payload_root/LICENSES/"
          cp "$maxine_license" "$payload_root/"

          short_sha="${GITHUB_SHA:0:8}"
          release_tag="maxine-rife-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          cat > "$payload_root/RIFE-runtime-release.json" <<EOF
          {
            "schemaVersion": 1,
            "releaseTag": "$release_tag",
            "assetBaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          }
          EOF

          for architecture in sm75 sm86 sm89 sm120; do
            cp "$runtime_artifact/MPCVR-RIFE-${architecture}.zip" "release/MPCVR-RIFE-${architecture}.zip"
          done

          runtime_notice_count=0
          while IFS= read -r notice; do
            cp "$notice" "$payload_root/"
            runtime_notice_count=$((runtime_notice_count + 1))
          done < <(find "$runtime_artifact" -maxdepth 1 -type f \( -name 'CUDA-*' -o -name 'TensorRT-*' \) -print | sort)
          if (( runtime_notice_count == 0 )); then
            echo "No CUDA/TensorRT notice files were found in the runtime artifact." >&2
            exit 1
          fi

          (
            cd "$payload_root"
            find . -type f ! -name 'PAYLOAD-SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' \
              > PAYLOAD-SHA256SUMS.txt
          )

          for required in \
            THIRD-PARTY-NOTICES.txt \
            Maxine-SDK-License.pdf \
            LICENSES/RIFE-model-license.txt; do
            if [[ ! -s "$payload_root/$required" ]]; then
              echo "Release notice gate is missing $required." >&2
              exit 1
            fi
          done
          if ! find "$payload_root" -maxdepth 1 -type f -name 'CUDA-*' -print -quit | grep -q .; then
            echo "Release notice gate is missing a CUDA notice file." >&2
            exit 1
          fi
          if ! find "$payload_root" -maxdepth 1 -type f -name 'TensorRT-*' -print -quit | grep -q .; then
            echo "Release notice gate is missing a TensorRT notice file." >&2
            exit 1
          fi

          (
            cd "$payload_root"
            while read -r hash file; do
              [[ -n "$file" ]] || continue
              echo "$hash  $file" | sha256sum --check --strict
            done < PAYLOAD-SHA256SUMS.txt
          )

          (
            cd "$setup_root"
            zip -r ../MPCVR-Maxine-RIFE-Setup.zip .
          )

          cp release/MpcVideoRenderer-Maxine-RIFE.zip release/MpcVideoRenderer-Maxine.zip
          cmp release/MpcVideoRenderer-Maxine-RIFE.zip release/MpcVideoRenderer-Maxine.zip

          (
            cd release
            sha256sum \
              MPCVR-Maxine-RIFE-Setup.zip \
              MpcVideoRenderer-Maxine-RIFE.zip \
              MpcVideoRenderer-Maxine.zip \
              MPCVR-RIFE-sm75.zip \
              MPCVR-RIFE-sm86.zip \
              MPCVR-RIFE-sm89.zip \
              MPCVR-RIFE-sm120.zip \
              > SHA256SUMS.txt

            sha256sum MpcVideoRenderer-Maxine.zip > MpcVideoRenderer-Maxine.zip.sha256
            sha256sum --check --strict SHA256SUMS.txt
          )

          required_setup_paths=(
            'Install-MPCVR-Maxine-RIFE.cmd'
            'Install-MPCVR-Maxine-RIFE.ps1'
            'Install-MPCVR-Maxine.cmd'
            'Install-MPCVR-Maxine.ps1'
            'README.md'
            'payload/Install-MPCVRMaxineRuntime.ps1'
            'payload/Install-MPCVRRifeRuntime.ps1'
            'payload/Test-MPCVRRifePreflight.ps1'
            'payload/RifeRuntimeManifest.psm1'
            'payload/Install-KLiteMPCVRUpdater.ps1'
            'payload/Update-KLiteMPCVR.ps1'
            'payload/KLiteRendererInstall.psm1'
            'payload/MpcVideoRenderer-Maxine-RIFE.zip'
            'payload/MPCVR-Maxine-Runtime.zip'
            'payload/MPCVR-RIFE-Common.zip'
            'payload/MPCVR-RIFE-Model-v4.6.zip'
            'payload/RIFE-runtime-manifest.json'
            'payload/RIFE-runtime-SHA256SUMS.txt'
            'payload/RIFE-runtime-release.json'
            'payload/THIRD-PARTY-NOTICES.txt'
            'payload/Maxine-SDK-License.pdf'
            'payload/LICENSES/RIFE-model-license.txt'
            'payload/PAYLOAD-SHA256SUMS.txt'
          )
          for required in "${required_setup_paths[@]}"; do
            if ! unzip -Z1 release/MPCVR-Maxine-RIFE-Setup.zip | grep -Fxq "$required"; then
              echo "Assembled setup is missing $required." >&2
              exit 1
            fi
          done

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          tag="maxine-rife-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          notes=$(cat <<EOF
          Custom MPC Video Renderer Maxine + RIFE build from master commit ${GITHUB_SHA}.

          Recommended download:
          - MPCVR-Maxine-RIFE-Setup.zip: one-click K-Lite setup containing the custom renderer, NVIDIA Maxine VSR runtime, RIFE 4.6 common TensorRT runtime/model, environment setup, and restore shortcut. During installation it detects the NVIDIA GPU compute capability and downloads only the matching architecture pack from this immutable release.

          Advanced/manual download:
          - MpcVideoRenderer-Maxine-RIFE.zip: portable renderer files only.

          RIFE TensorRT runtime support in this release covers NVIDIA Turing (compute capability 7.5), Ampere (8.6), Ada (8.9), and Blackwell (12.0) desktop GPUs. The MPCVR-RIFE-sm*.zip assets are architecture packs consumed automatically by Setup.

          SHA256SUMS.txt verifies the setup, renderer packages, and architecture packs. MpcVideoRenderer-Maxine.zip plus its .sha256 remain temporarily for updater shortcuts installed by older releases.
          EOF
          )

          gh release create "$tag" \
            release/MPCVR-Maxine-RIFE-Setup.zip \
            release/MpcVideoRenderer-Maxine-RIFE.zip \
            release/MpcVideoRenderer-Maxine.zip \
            release/MPCVR-RIFE-sm75.zip \
            release/MPCVR-RIFE-sm86.zip \
            release/MPCVR-RIFE-sm89.zip \
            release/MPCVR-RIFE-sm120.zip \
            release/SHA256SUMS.txt \
            release/MpcVideoRenderer-Maxine.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "MPC Video Renderer Maxine + RIFE build ${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --latest
