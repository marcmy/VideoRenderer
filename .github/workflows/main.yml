name: Build VideoRenderer

on:
  push:
    paths-ignore:
      - '**.txt'
      - '**.md'
      - '**.cmd'
      - '**.vcxproj.filters'
  pull_request:
    paths-ignore:
      - '**.txt'
      - '**.md'
      - '**.cmd'
      - '**.vcxproj.filters'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: One-time native NVOF precompile and soft-reset patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/native-nvof-interpolation'
        shell: pwsh
        run: |
          if (Test-Path 'Source/NvidiaOpticalFlowMidpointBytecode.h') {
            Write-Host 'Patch already landed; skipping.'
            exit 0
          }

          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }

          @'
          from pathlib import Path
          import re

          path = Path('Source/NvidiaOpticalFlowNative.cpp')
          source = path.read_text(encoding='utf-8')
          marker0 = 'constexpr char MidpointShader[] = R"hlsl('
          marker1 = ')hlsl";'
          start = source.index(marker0) + len(marker0)
          end = source.index(marker1, start)
          Path('build').mkdir(exist_ok=True)
          Path('build/NativeNvofMidpoint.hlsl').write_text(source[start:end], encoding='utf-8')
          '@ | python -

          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX `
            /Fh Source/NvidiaOpticalFlowMidpointBytecode.h `
            /Vn g_NativeNvofMidpointBytecode `
            build/NativeNvofMidpoint.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from pathlib import Path
          import re

          path = Path('Source/NvidiaOpticalFlowNative.cpp')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '#include "NvidiaOpticalFlowNative.h"\n',
              '#include "NvidiaOpticalFlowNative.h"\n#include "NvidiaOpticalFlowMidpointBytecode.h"\n', 1)

          pattern = re.compile(
              r'\n\t\tCComPtr<ID3DBlob> bytecode;.*?\n\t\tD3D11_SAMPLER_DESC samplerDesc = \{\};', re.S)
          replacement = '''
\t\thr = device->CreateComputeShader(
\t\t\tg_NativeNvofMidpointBytecode,
\t\t\tsizeof(g_NativeNvofMidpointBytecode),
\t\t\tnullptr, &midpointShader);
\t\tif (FAILED(hr)) {
\t\t\tstatus = std::format(L"CreateComputeShader(native midpoint bytecode) failed ({})", HR2Str(hr));
\t\t\treturn false;
\t\t}

\t\tD3D11_SAMPLER_DESC samplerDesc = {};'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise RuntimeError(f'Expected one D3DCompile block, replaced {count}.')

          marker = '\n\tvoid ResetUnlocked()\n\t{'
          soft = '''
\tvoid SoftResetUnlocked()
\t{
\t\twriteIndex = currentIndex = 0;
\t\twarmedUp = false;
\t\toutputValid = false;
\t\thasExecutedFlow = false;
\t\thavePreviousTimestamp = false;
\t\tpreviousTimestamp = 0.0;
\t\tprocessTimeMs = 0.0;
\t\tstatus = session ? L"Native NVOF reset; waiting for frames" : L"Disabled";
\t}
'''
          if marker not in source:
              raise RuntimeError('ResetUnlocked marker not found.')
          source = source.replace(marker, '\n' + soft + marker, 1)

          old = '''CNvidiaOpticalFlowNative::~CNvidiaOpticalFlowNative()
{
\tReset();
}'''
          new = '''CNvidiaOpticalFlowNative::~CNvidiaOpticalFlowNative()
{
#ifdef _WIN64
\tif (m_impl->inputTransaction.owns_lock()) {
\t\tm_impl->inputTransaction.unlock();
\t}
\tstd::lock_guard<std::recursive_mutex> lock(m_impl->apiMutex);
\tm_impl->ResetUnlocked();
#endif
}'''
          if old not in source:
              raise RuntimeError('Destructor target not found.')
          source = source.replace(old, new, 1)

          old = '''void CNvidiaOpticalFlowNative::Reset()
{
#ifdef _WIN64
\tif (m_impl->inputTransaction.owns_lock()) {
\t\tm_impl->inputTransaction.unlock();
\t}
\tstd::lock_guard<std::recursive_mutex> lock(m_impl->apiMutex);
\tm_impl->ResetUnlocked();
\tm_impl->status = L"Disabled";
#endif
}'''
          new = '''void CNvidiaOpticalFlowNative::Reset()
{
#ifdef _WIN64
\tif (m_impl->inputTransaction.owns_lock()) {
\t\tm_impl->inputTransaction.unlock();
\t}
\tstd::lock_guard<std::recursive_mutex> lock(m_impl->apiMutex);
\t// Playback discontinuities only invalidate frame/temporal history.
\t// Preserve the initialized driver session and D3D11 resources so a seek
\t// cannot force synchronous shader compilation/session reconstruction.
\tm_impl->SoftResetUnlocked();
#endif
}'''
          if old not in source:
              raise RuntimeError('Public Reset target not found.')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          '@ | python -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/NvidiaOpticalFlowNative.cpp Source/NvidiaOpticalFlowMidpointBytecode.h
          git commit -m "Eliminate native NVOF playback reset stalls"
          git push origin HEAD:feature/native-nvof-interpolation

      - name: Build VideoRenderer
        run: |
          .\build_mpcvr.cmd NoWait
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "MPC Video Renderer"
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0

  publish-maxine:
    name: Publish latest Maxine build
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: "MPC Video Renderer"
          path: release

      - name: Prepare release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package="$(find release -maxdepth 1 -type f -name 'MpcVideoRenderer*.zip' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "No MPC Video Renderer package was found in the build artifact." >&2
            exit 1
          fi
          cp "$package" release/MpcVideoRenderer-Maxine.zip

          mkdir -p release/runtime-source
          mkdir -p release/previous-setup
          if gh release download \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'MPCVR-Maxine-Setup.zip' \
              --dir release/previous-setup; then
            previous_setup="$(find release/previous-setup -maxdepth 1 -type f -name 'MPCVR-Maxine-Setup.zip' -print -quit)"
            if [[ -n "$previous_setup" ]]; then
              unzip -j "$previous_setup" \
                'payload/MPCVR-Maxine-Runtime.zip' \
                'payload/MPCVR-Maxine-Runtime.zip.sha256' \
                -d release/runtime-source || true
            fi
          fi

          if [[ ! -f release/runtime-source/MPCVR-Maxine-Runtime.zip \
                || ! -f release/runtime-source/MPCVR-Maxine-Runtime.zip.sha256 ]]; then
            echo "No embedded runtime was found; trying the legacy standalone release assets."
            gh release download \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'MPCVR-Maxine-Runtime.zip' \
              --pattern 'MPCVR-Maxine-Runtime.zip.sha256' \
              --dir release/runtime-source
          fi

          runtime_zip='release/runtime-source/MPCVR-Maxine-Runtime.zip'
          runtime_checksum='release/runtime-source/MPCVR-Maxine-Runtime.zip.sha256'
          if [[ ! -f "$runtime_zip" || ! -f "$runtime_checksum" ]]; then
            echo "A verified Maxine runtime bundle is required to publish the unified setup." >&2
            exit 1
          fi

          expected="$(awk '{print tolower($1); exit}' "$runtime_checksum")"
          actual="$(sha256sum "$runtime_zip" | awk '{print tolower($1)}')"
          if [[ ! "$expected" =~ ^[a-f0-9]{64}$ || "$actual" != "$expected" ]]; then
            echo "The carried Maxine runtime checksum did not verify." >&2
            exit 1
          fi
          echo "Verified the carried Maxine runtime bundle: $actual"

          setup_root='release/setup-root'
          payload_root="$setup_root/payload"
          mkdir -p "$payload_root"

          cp tools/MaxineSetup/Install-MPCVR-Maxine.cmd "$setup_root/"
          cp tools/MaxineSetup/Install-MPCVR-Maxine.ps1 "$setup_root/"
          cp tools/MaxineSetup/README.md "$setup_root/README.md"

          cp tools/MaxineRuntimeInstaller/Install-MPCVRMaxineRuntime.ps1 "$payload_root/"
          cp tools/KLiteMaxineUpdater/Install-KLiteMPCVRUpdater.ps1 "$payload_root/"
          cp tools/KLiteMaxineUpdater/Update-KLiteMPCVR.ps1 "$payload_root/"
          cp release/MpcVideoRenderer-Maxine.zip "$payload_root/"
          cp "$runtime_zip" "$payload_root/"
          cp "$runtime_checksum" "$payload_root/"

          (
            cd "$payload_root"
            sha256sum \
              MpcVideoRenderer-Maxine.zip \
              MPCVR-Maxine-Runtime.zip \
              > PAYLOAD-SHA256SUMS.txt
          )

          (
            cd "$setup_root"
            zip -r ../MPCVR-Maxine-Setup.zip .
          )

          (
            cd release
            sha256sum \
              MPCVR-Maxine-Setup.zip \
              MpcVideoRenderer-Maxine.zip \
              > SHA256SUMS.txt
            sha256sum MpcVideoRenderer-Maxine.zip > MpcVideoRenderer-Maxine.zip.sha256
          )

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          tag="maxine-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          notes=$(cat <<EOF
          Custom Maxine build from master commit ${GITHUB_SHA}.

          Recommended download:
          - MPCVR-Maxine-Setup.zip: one-click K-Lite setup containing the custom renderer, five-DLL Maxine runtime, environment-variable setup, and restore shortcut.

          Advanced/manual download:
          - MpcVideoRenderer-Maxine.zip: portable renderer files only.

          SHA256SUMS.txt verifies both public ZIP files. The small per-renderer checksum remains only for compatibility with updater shortcuts installed by older releases.
          EOF
          )

          gh release create "$tag" \
            release/MPCVR-Maxine-Setup.zip \
            release/MpcVideoRenderer-Maxine.zip \
            release/SHA256SUMS.txt \
            release/MpcVideoRenderer-Maxine.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "MPC Video Renderer Maxine build ${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --latest