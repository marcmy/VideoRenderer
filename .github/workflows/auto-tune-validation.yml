name: Validate automatic calibration

on:
  push:
    paths:
      - 'tools/UnifiedSetup/MpcvrSetup.AutoTune.psm1'
      - 'tools/UnifiedSetup/Invoke-MpcvrAutoTune.ps1'
      - 'tools/UnifiedSetup/AutoTune-Mpcvr.cmd'
      - '.github/workflows/auto-tune-validation.yml'
  pull_request:
    paths:
      - 'tools/UnifiedSetup/MpcvrSetup.AutoTune.psm1'
      - 'tools/UnifiedSetup/Invoke-MpcvrAutoTune.ps1'
      - 'tools/UnifiedSetup/AutoTune-Mpcvr.cmd'
      - '.github/workflows/auto-tune-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\UnifiedSetup\Invoke-MpcvrAutoTune.ps1 `
            -ValidateOnly

      - name: Validate with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\UnifiedSetup\Invoke-MpcvrAutoTune.ps1 -ValidateOnly
