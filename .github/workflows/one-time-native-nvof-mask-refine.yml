name: One-time native NVOF repair-mask refinement

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-native-nvof-mask-refine.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch repair mask
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cppPath = 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp'
          $cpp = [IO.File]::ReadAllText($cppPath)
          $oldCpp = "        2u, 3u, 1.0f, 0.0f,"
          $newCpp = "        2u, 4u, 1.5f, 0.0f,"
          if (-not $cpp.Contains($oldCpp)) { throw 'Expected repair-mask parameters were not found.' }
          [IO.File]::WriteAllText($cppPath, $cpp.Replace($oldCpp, $newCpp), [Text.UTF8Encoding]::new($false))

          $warpPath = 'Source/NvidiaOpticalFlowDenseWarp.hlsl'
          $warp = [IO.File]::ReadAllText($warpPath)
          $oldWarp = '    float repairMask = SampleRepair(source).z;'
          $newWarp = '    float repairMask = max(SampleRepair(source).z, SampleRepair(target).z);'
          if (-not $warp.Contains($oldWarp)) { throw 'Expected repair-mask sampling line was not found.' }
          [IO.File]::WriteAllText($warpPath, $warp.Replace($oldWarp, $newWarp), [Text.UTF8Encoding]::new($false))

          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }

          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh Source/NvidiaOpticalFlowDenseRepairBytecode.h /Vn g_NvofDenseRepairBytecode Source/NvidiaOpticalFlowDenseRepair.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh Source/NvidiaOpticalFlowDenseWarpBytecode.h /Vn g_NvofDenseWarpBytecode Source/NvidiaOpticalFlowDenseWarp.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MPCVR test package
        uses: actions/upload-artifact@v7
        with:
          name: MPCVR native NVOF refined-mask test
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0

      - name: Commit validated refinement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            Source/NvidiaOpticalFlowDenseSynthesizer.cpp `
            Source/NvidiaOpticalFlowDenseRepairBytecode.h `
            Source/NvidiaOpticalFlowDenseWarp.hlsl `
            Source/NvidiaOpticalFlowDenseWarpBytecode.h
          git rm -- .github/workflows/one-time-native-nvof-mask-refine.yml
          git commit -m 'Refine local NVOF repair mask coverage'
          git push origin HEAD:feature/native-nvof-interpolation
