name: One-time native NVOF no-temporal-hints test

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-native-nvof-no-temporal-hints.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Disable temporal hints and expose global-repeat telemetry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nativePath = 'Source/NvidiaOpticalFlowNative.cpp'
          $native = [IO.File]::ReadAllText($nativePath)
          $oldHints = 'input.disableTemporalHints = hasExecutedFlow ? nvof::False : nvof::True;'
          $newHints = 'input.disableTemporalHints = nvof::True;'
          if (-not $native.Contains($oldHints)) { throw 'Expected temporal-hint line was not found.' }
          $native = $native.Replace($oldHints, $newHints)
          [IO.File]::WriteAllText($nativePath, $native, [Text.UTF8Encoding]::new($false))

          $densePath = 'Source/NvidiaOpticalFlowDenseSynthesizer.cpp'
          $dense = [IO.File]::ReadAllText($densePath)
          $oldTelemetry = @'
    return std::format(
        L"bad {:.1f}% ({}/{}), worst7x7 {}/49, would8={}, would18={}",
        badPercent, m_lastUnsafeCount, cellCount, m_lastMaxLocalUnsafe,
        m_lastMaxLocalUnsafe >= 8 ? L"yes" : L"no",
        m_lastMaxLocalUnsafe >= 18 ? L"yes" : L"no");
'@
          $newTelemetry = @'
    return std::format(
        L"globalRepeat={}, bad {:.1f}% ({}/{}), worst7x7 {}/49, would8={}, would18={}",
        m_lastUnsafeCount * 4u >= cellCount ? L"YES" : L"no",
        badPercent, m_lastUnsafeCount, cellCount, m_lastMaxLocalUnsafe,
        m_lastMaxLocalUnsafe >= 8 ? L"yes" : L"no",
        m_lastMaxLocalUnsafe >= 18 ? L"yes" : L"no");
'@
          if (-not $dense.Contains($oldTelemetry)) { throw 'Expected telemetry block was not found.' }
          $dense = $dense.Replace($oldTelemetry, $newTelemetry)
          [IO.File]::WriteAllText($densePath, $dense, [Text.UTF8Encoding]::new($false))

          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MPCVR test package
        uses: actions/upload-artifact@v7
        with:
          name: MPCVR native NVOF no-temporal-hints test
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0

      - name: Commit validated diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Source/NvidiaOpticalFlowNative.cpp Source/NvidiaOpticalFlowDenseSynthesizer.cpp
          git rm -- .github/workflows/one-time-native-nvof-no-temporal-hints.yml
          git commit -m 'Disable NVOF temporal hints for scene-cut diagnostic'
          git push origin HEAD:feature/native-nvof-interpolation
