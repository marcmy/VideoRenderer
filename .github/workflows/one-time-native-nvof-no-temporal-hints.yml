name: One-time native NVOF no-temporal-hints test

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-native-nvof-no-temporal-hints.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Disable temporal hints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Source/NvidiaOpticalFlowNative.cpp'
          $text = [IO.File]::ReadAllText($path)
          $old = 'input.disableTemporalHints = hasExecutedFlow ? nvof::False : nvof::True;'
          $new = 'input.disableTemporalHints = nvof::True;'
          if (-not $text.Contains($old)) { throw 'Expected temporal-hint line was not found.' }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MPCVR test package
        uses: actions/upload-artifact@v7
        with:
          name: MPCVR native NVOF no-temporal-hints test
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0

      - name: Commit validated diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Source/NvidiaOpticalFlowNative.cpp
          git rm -- .github/workflows/one-time-native-nvof-no-temporal-hints.yml
          git commit -m 'Disable NVOF temporal hints for scene-cut diagnostic'
          git push origin HEAD:feature/native-nvof-interpolation
