name: Apply FRUC lookahead source

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/nvoffruc-lookahead'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/nvoffruc-lookahead
          fetch-depth: 0
          submodules: recursive

      - name: Verify and apply lookahead patch
        shell: bash
        run: |
          tr -d '\r\n' < .github/fruc-lookahead.patch.gz.b64 > "$RUNNER_TEMP/payload.b64"
          echo "e5ef526e821f027e9eaa8733a379bce96fb959644d66290d4f9596be35ed74db  $RUNNER_TEMP/payload.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/payload.b64" | gzip --decompress --stdout > "$RUNNER_TEMP/fruc-lookahead.patch"
          echo "a7dddcba3606950ea128c9a1bd5ed3061e540aee08d73cc7997071a0697e52e9  $RUNNER_TEMP/fruc-lookahead.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/fruc-lookahead.patch"
          git apply "$RUNNER_TEMP/fruc-lookahead.patch"
          rm -f .github/fruc-lookahead.patch.gz.b64 .github/workflows/apply-fruc-lookahead.yml

      - name: Commit lookahead implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: pipeline NvOFFRUC source presentation"
          git push origin HEAD:feature/nvoffruc-lookahead
