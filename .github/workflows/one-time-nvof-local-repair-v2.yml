name: One-time native NVOF local repair integration v2
# Retry with the same recursive-submodule checkout as the production build.

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-nvof-local-repair-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch synthesizer, compile shaders, and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Repair a quoting typo in the temporary patch helper before executing it.
          $patchPath = 'tools/one-time-nvof-local-repair.py'
          $patchText = [IO.File]::ReadAllText($patchPath)
          $bad = '||\n", "repair parameter buffer")'
          $good = "||\n', 'repair parameter buffer')"
          if (-not $patchText.Contains($bad)) { throw 'Expected temporary patch-script typo was not found.' }
          [IO.File]::WriteAllText($patchPath, $patchText.Replace($bad, $good), [Text.UTF8Encoding]::new($false))

          python tools/one-time-nvof-local-repair.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }

          $specs = @(
            @{ Source='Source/NvidiaOpticalFlowDenseSeed.hlsl'; Header='Source/NvidiaOpticalFlowDenseSeedBytecode.h'; Name='g_NvofDenseSeedBytecode' },
            @{ Source='Source/NvidiaOpticalFlowDenseRepair.hlsl'; Header='Source/NvidiaOpticalFlowDenseRepairBytecode.h'; Name='g_NvofDenseRepairBytecode' },
            @{ Source='Source/NvidiaOpticalFlowDenseWarp.hlsl'; Header='Source/NvidiaOpticalFlowDenseWarpBytecode.h'; Name='g_NvofDenseWarpBytecode' }
          )
          foreach ($spec in $specs) {
            & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /WX /Fh $spec.Header /Vn $spec.Name $spec.Source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          # fxc's /Fh output intentionally contains trailing spaces in generated
          # disassembly/byte-array lines. The shader compiler and full MPCVR build
          # are the authoritative gates for this one-time integration.
          .\build_mpcvr.cmd NoWait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            Source/NvidiaOpticalFlowDenseSeed.hlsl `
            Source/NvidiaOpticalFlowDenseSeedBytecode.h `
            Source/NvidiaOpticalFlowDenseRepair.hlsl `
            Source/NvidiaOpticalFlowDenseRepairBytecode.h `
            Source/NvidiaOpticalFlowDenseWarp.hlsl `
            Source/NvidiaOpticalFlowDenseWarpBytecode.h `
            Source/NvidiaOpticalFlowDenseSynthesizer.cpp `
            Source/NvidiaOpticalFlowDenseSynthesizer.h `
            .github/workflows/dense-nvof-shader-validation.yml
          git rm -- `
            .github/workflows/one-time-nvof-local-repair.yml `
            .github/workflows/one-time-nvof-local-repair-v2.yml `
            tools/one-time-nvof-local-repair.py

          git commit -m 'Add occlusion-aware local NVOF repair'
          git push origin HEAD:feature/native-nvof-interpolation
