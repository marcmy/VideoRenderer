name: Native NVOF regional frame rejection

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-native-nvof-region-reject.ps1
      - .github/workflows/native-nvof-region-reject.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add regional whole-frame rejection and regenerate shaders
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-native-nvof-region-reject.ps1
