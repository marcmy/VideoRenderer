name: Build RIFE 4.6 model

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rife-tensorrt-interpolation
    paths:
      - .github/workflows/rife-model.yml
      - tools/RifeTensorRTRuntime/prepare_model.py

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install model preparation dependencies
        run: python -m pip install --upgrade "nvidia-modelopt[onnx]" py7zr

      - name: Download upstream vs-mlrt RIFE models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _rife-model/source _rife-model/output
          curl --fail --location --retry 3 \
            --output _rife-model/rife_v8.7z \
            https://github.com/AmusementClub/vs-mlrt/releases/download/model-20220923/rife_v8.7z

      - name: Convert RIFE 4.6 to mixed FP16
        run: python tools/RifeTensorRTRuntime/prepare_model.py _rife-model/rife_v8.7z _rife-model/output/rife_v4.6.onnx

      - name: Write provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd _rife-model/output
          sha256sum rife_v4.6.onnx > SHA256SUMS.txt
          cat > SOURCE.txt <<'EOF'
          Model: RIFE v4.6 (fastmode=True, ensemble=False)
          Upstream model collection: AmusementClub/vs-mlrt
          Release: model-20220923
          Archive: rife_v8.7z
          Source model: rife/rife_v4.6.onnx
          Training/model lineage: hzwer/Practical-RIFE
          Conversion: NVIDIA Model Optimizer AutoCast, mixed FP16/FP32
          Public I/O precision: FP16
          Expected contract: input [1,11,H,W], output [1,3,H,W]
          EOF
          cat SHA256SUMS.txt

      - name: Upload RIFE model artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpcvr-rife-v4.6-model
          path: _rife-model/output/
          if-no-files-found: error
          compression-level: 0
