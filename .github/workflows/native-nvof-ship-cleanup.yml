name: Native NVOF ship cleanup

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-native-nvof-ship-cleanup.ps1
      - .github/workflows/native-nvof-ship-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove abandoned synthesis paths
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-native-nvof-ship-cleanup.ps1
