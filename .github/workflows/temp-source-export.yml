name: Temporary source export

on:
  push:
    branches:
      - temp/source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Package source tree
        run: |
          git archive --format=zip --output=VideoRenderer-source.zip HEAD
          rm -rf _submodules
          mkdir -p _submodules
          git submodule foreach --recursive 'mkdir -p "$toplevel/_submodules/$sm_path" && git archive --format=tar HEAD | tar -x -C "$toplevel/_submodules/$sm_path"'
          zip -qr VideoRenderer-source.zip _submodules

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: VideoRenderer-source
          path: VideoRenderer-source.zip
          compression-level: 0
          retention-days: 1
