name: Native FRUC Replay Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/NativeFrucReplayTest.cpp
      - .github/workflows/native-fruc-replay.yml
  pull_request:
    paths:
      - tools/native-nvof-probe/NativeFrucReplayTest.cpp
      - .github/workflows/native-fruc-replay.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build 64-bit FRUC replay probe
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1

          set "VSROOT="
          for /f "usebackq delims=" %%I in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          if not defined VSROOT exit /b 1

          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1

          if not exist build\native-fruc-replay mkdir build\native-fruc-replay

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Fo:build\native-fruc-replay\NativeFrucReplayTest.obj ^
            /Fe:build\native-fruc-replay\NativeFrucReplayTest.exe ^
            tools\native-nvof-probe\NativeFrucReplayTest.cpp ^
            /link d3d11.lib dxgi.lib
          if errorlevel 1 exit /b 1

      - name: Upload FRUC replay probe
        uses: actions/upload-artifact@v7
        with:
          name: Native-FRUC-Replay-Probe
          path: build/native-fruc-replay
          if-no-files-found: error
          retention-days: 14
