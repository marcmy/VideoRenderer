name: Apply frame interpolation dialog

on:
  push:
    paths:
      - '.github/workflows/apply-frame-interpolation-dialog.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/apply-frame-interpolation-dialog.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip fruc dialog]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/nvidia-frame-interpolation
          fetch-depth: 0

      - name: Add dedicated frame interpolation settings dialog
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Could not locate patch target in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8-sig')

          replace('Source/resource.h', '#define IDD_MAXINESETTINGS              106\n', '#define IDD_MAXINESETTINGS              106\n#define IDD_FRAMEINTERPOLATION           107\n')
          replace('Source/resource.h', '#define IDC_STATIC_MAXINE_OVERSAMPLE    1091\n', '''#define IDC_STATIC_MAXINE_OVERSAMPLE    1091
#define IDC_BUTTON_FRAMEINTERPOLATION    1092
#define IDC_FRUC_MODE                    1093
#define IDC_FRUC_SOURCE_LIMIT            1094
#define IDC_FRUC_MAX_OUTPUT              1095
#define IDC_FRUC_GPU                     1096
#define IDC_FRUC_FALLBACK                1097
#define IDC_BUTTON_FRUC_DEFAULTS         1098
''')
          replace('Source/resource.h', '#define _APS_NEXT_RESOURCE_VALUE        107\n', '#define _APS_NEXT_RESOURCE_VALUE        108\n')
          replace('Source/resource.h', '#define _APS_NEXT_CONTROL_VALUE         1092\n', '#define _APS_NEXT_CONTROL_VALUE         1099\n')

          replace('Source/MpcVideoRenderer.rc', '    PUSHBUTTON      "NVIDIA Maxine settings...",IDC_BUTTON_MAXINE,10,132,149,16\n', '    PUSHBUTTON      "Maxine settings...",IDC_BUTTON_MAXINE,10,132,72,16\n    PUSHBUTTON      "Frame interpolation...",IDC_BUTTON_FRAMEINTERPOLATION,87,132,78,16\n')
          fruc_dialog = r'''
IDD_FRAMEINTERPOLATION DIALOGEX 0, 0, 304, 190
STYLE DS_SETFONT | DS_MODALFRAME | WS_POPUP | WS_CAPTION | WS_SYSMENU
CAPTION "NVIDIA frame interpolation settings"
FONT 9, "Segoe UI", 400, 0, 0x0
BEGIN
    GROUPBOX        "Frame rate up-conversion",IDC_STATIC,7,7,290,116
    LTEXT           "Mode:",IDC_STATIC,16,23,76,8
    COMBOBOX        IDC_FRUC_MODE,101,20,184,60,CBS_DROPDOWNLIST | WS_VSCROLL | WS_TABSTOP
    LTEXT           "Maximum source:",IDC_STATIC,16,46,76,8
    COMBOBOX        IDC_FRUC_SOURCE_LIMIT,101,43,184,70,CBS_DROPDOWNLIST | WS_VSCROLL | WS_TABSTOP
    LTEXT           "Maximum output:",IDC_STATIC,16,69,76,8
    COMBOBOX        IDC_FRUC_MAX_OUTPUT,101,66,184,60,CBS_DROPDOWNLIST | WS_VSCROLL | WS_TABSTOP
    CONTROL         "Use the original frame when interpolation confidence is low",IDC_FRUC_FALLBACK,
                    "Button",BS_AUTOCHECKBOX | WS_TABSTOP,16,91,269,10
    LTEXT           "Double mode inserts one generated midpoint frame between each pair of source frames.",IDC_STATIC,16,105,269,16,SS_LEFT
    GROUPBOX        "Advanced",IDC_STATIC,7,128,290,34
    LTEXT           "CUDA GPU:",IDC_STATIC,16,143,76,8
    COMBOBOX        IDC_FRUC_GPU,101,140,91,70,CBS_DROPDOWNLIST | WS_VSCROLL | WS_TABSTOP
    LTEXT           "Auto is recommended unless the system has multiple NVIDIA GPUs.",IDC_STATIC,199,139,86,22,SS_LEFT
    PUSHBUTTON      "Defaults",IDC_BUTTON_FRUC_DEFAULTS,7,170,48,16
    DEFPUSHBUTTON   "OK",IDOK,193,170,48,16
    PUSHBUTTON      "Cancel",IDCANCEL,249,170,48,16
END

'''
          replace('Source/MpcVideoRenderer.rc', 'IDD_INFOPROPPAGE DIALOGEX 0, 0, 318, 153\n', fruc_dialog + 'IDD_INFOPROPPAGE DIALOGEX 0, 0, 318, 153\n')
          replace('Source/MpcVideoRenderer.rc', 'IDD_INFOPROPPAGE AFX_DIALOG_LAYOUT\nBEGIN\n    0\nEND\n\nIDD_MAXINESETTINGS AFX_DIALOG_LAYOUT', 'IDD_INFOPROPPAGE AFX_DIALOG_LAYOUT\nBEGIN\n    0\nEND\n\nIDD_FRAMEINTERPOLATION AFX_DIALOG_LAYOUT\nBEGIN\n    0\nEND\n\nIDD_MAXINESETTINGS AFX_DIALOG_LAYOUT')

          fruc_enums = r'''
enum :int {
	FRUC_MODE_Disabled = 0,
	FRUC_MODE_Double,
	FRUC_MODE_COUNT
};

enum :int {
	FRUC_SOURCE_LIMIT_720p = 0,
	FRUC_SOURCE_LIMIT_1080p,
	FRUC_SOURCE_LIMIT_1440p,
	FRUC_SOURCE_LIMIT_2160p,
	FRUC_SOURCE_LIMIT_COUNT
};

enum :int {
	FRUC_MAX_OUTPUT_60 = 60,
	FRUC_MAX_OUTPUT_120 = 120,
	FRUC_MAX_OUTPUT_240 = 240,
};

constexpr inline int FRUC_GPU_Auto = -1;

'''
          replace('Source/IVideoRenderer.h', 'constexpr inline int MAXINE_AUTO_BITRATE_MAX = 1000;\n\n', 'constexpr inline int MAXINE_AUTO_BITRATE_MAX = 1000;\n\n' + fruc_enums)
          replace('Source/IVideoRenderer.h', '\tint iMaxineAutoBitrate;\n\n\tSettings_t() {', '''\tint iMaxineAutoBitrate;
\tint iFrameInterpolationMode;
\tint iFrameInterpolationSourceLimit;
\tint iFrameInterpolationMaxOutput;
\tint iFrameInterpolationGPU;
\tbool bFrameInterpolationFallback;

\tSettings_t() {''')
          replace('Source/IVideoRenderer.h', '\t\tiMaxineAutoBitrate              = MAXINE_AUTO_BITRATE_DEF;\n', '''\t\tiMaxineAutoBitrate              = MAXINE_AUTO_BITRATE_DEF;
\t\tiFrameInterpolationMode         = FRUC_MODE_Disabled;
\t\tiFrameInterpolationSourceLimit  = FRUC_SOURCE_LIMIT_1080p;
\t\tiFrameInterpolationMaxOutput    = FRUC_MAX_OUTPUT_60;
\t\tiFrameInterpolationGPU          = FRUC_GPU_Auto;
\t\tbFrameInterpolationFallback     = true;
''')
          replace('Source/PropPage.h', '\tbool ShowMaxineSettings();\n', '\tbool ShowMaxineSettings();\n\tbool ShowFrameInterpolationSettings();\n')

          fruc_code = r'''
void CopyFrameInterpolationSettings(Settings_t& dst, const Settings_t& src)
{
	dst.iFrameInterpolationMode = src.iFrameInterpolationMode;
	dst.iFrameInterpolationSourceLimit = src.iFrameInterpolationSourceLimit;
	dst.iFrameInterpolationMaxOutput = src.iFrameInterpolationMaxOutput;
	dst.iFrameInterpolationGPU = src.iFrameInterpolationGPU;
	dst.bFrameInterpolationFallback = src.bFrameInterpolationFallback;
}

bool FrameInterpolationSettingsEqual(const Settings_t& a, const Settings_t& b)
{
	return a.iFrameInterpolationMode == b.iFrameInterpolationMode
		&& a.iFrameInterpolationSourceLimit == b.iFrameInterpolationSourceLimit
		&& a.iFrameInterpolationMaxOutput == b.iFrameInterpolationMaxOutput
		&& a.iFrameInterpolationGPU == b.iFrameInterpolationGPU
		&& a.bFrameInterpolationFallback == b.bFrameInterpolationFallback;
}

void EnableFrameInterpolationDialogControls(HWND hwnd)
{
	const bool enabled = ComboBox_GetCurItemData(hwnd, IDC_FRUC_MODE) != FRUC_MODE_Disabled;
	for (const int id : {IDC_FRUC_SOURCE_LIMIT, IDC_FRUC_MAX_OUTPUT, IDC_FRUC_GPU, IDC_FRUC_FALLBACK}) {
		EnableWindow(GetDlgItem(hwnd, id), enabled);
	}
}

void SetFrameInterpolationDialogControls(HWND hwnd, const Settings_t& settings)
{
	ComboBox_SelectByItemData(hwnd, IDC_FRUC_MODE, settings.iFrameInterpolationMode);
	ComboBox_SelectByItemData(hwnd, IDC_FRUC_SOURCE_LIMIT, settings.iFrameInterpolationSourceLimit);
	ComboBox_SelectByItemData(hwnd, IDC_FRUC_MAX_OUTPUT, settings.iFrameInterpolationMaxOutput);
	ComboBox_SelectByItemData(hwnd, IDC_FRUC_GPU, settings.iFrameInterpolationGPU);
	CheckDlgButton(hwnd, IDC_FRUC_FALLBACK, settings.bFrameInterpolationFallback ? BST_CHECKED : BST_UNCHECKED);
	EnableFrameInterpolationDialogControls(hwnd);
}

void InitializeFrameInterpolationDialog(HWND hwnd, const Settings_t& settings)
{
	PopulateMaxineCombo(hwnd, IDC_FRUC_MODE, {{L"Disabled", FRUC_MODE_Disabled}, {L"Double source frame rate", FRUC_MODE_Double}});
	PopulateMaxineCombo(hwnd, IDC_FRUC_SOURCE_LIMIT, {{L"720p or lower", FRUC_SOURCE_LIMIT_720p}, {L"1080p or lower", FRUC_SOURCE_LIMIT_1080p}, {L"1440p or lower", FRUC_SOURCE_LIMIT_1440p}, {L"2160p or lower", FRUC_SOURCE_LIMIT_2160p}});
	PopulateMaxineCombo(hwnd, IDC_FRUC_MAX_OUTPUT, {{L"60 fps", FRUC_MAX_OUTPUT_60}, {L"120 fps", FRUC_MAX_OUTPUT_120}, {L"240 fps", FRUC_MAX_OUTPUT_240}});
	PopulateMaxineCombo(hwnd, IDC_FRUC_GPU, {{L"Auto", FRUC_GPU_Auto}, {L"GPU 0", 0}, {L"GPU 1", 1}, {L"GPU 2", 2}, {L"GPU 3", 3}, {L"GPU 4", 4}, {L"GPU 5", 5}, {L"GPU 6", 6}, {L"GPU 7", 7}});
	SetFrameInterpolationDialogControls(hwnd, settings);
}

void ReadFrameInterpolationDialog(HWND hwnd, Settings_t& settings)
{
	settings.iFrameInterpolationMode = static_cast<int>(ComboBox_GetCurItemData(hwnd, IDC_FRUC_MODE));
	settings.iFrameInterpolationSourceLimit = static_cast<int>(ComboBox_GetCurItemData(hwnd, IDC_FRUC_SOURCE_LIMIT));
	settings.iFrameInterpolationMaxOutput = static_cast<int>(ComboBox_GetCurItemData(hwnd, IDC_FRUC_MAX_OUTPUT));
	settings.iFrameInterpolationGPU = static_cast<int>(ComboBox_GetCurItemData(hwnd, IDC_FRUC_GPU));
	settings.bFrameInterpolationFallback = IsDlgButtonChecked(hwnd, IDC_FRUC_FALLBACK) == BST_CHECKED;
}

INT_PTR CALLBACK FrameInterpolationSettingsDlgProc(HWND hwnd, UINT message, WPARAM wParam, LPARAM lParam)
{
	auto* settings = reinterpret_cast<Settings_t*>(GetWindowLongPtrW(hwnd, GWLP_USERDATA));
	switch (message) {
	case WM_INITDIALOG:
		settings = reinterpret_cast<Settings_t*>(lParam);
		SetWindowLongPtrW(hwnd, GWLP_USERDATA, reinterpret_cast<LONG_PTR>(settings));
		InitializeFrameInterpolationDialog(hwnd, *settings);
		return TRUE;
	case WM_COMMAND:
		switch (LOWORD(wParam)) {
		case IDC_FRUC_MODE:
			if (HIWORD(wParam) == CBN_SELCHANGE) { EnableFrameInterpolationDialogControls(hwnd); return TRUE; }
			break;
		case IDC_BUTTON_FRUC_DEFAULTS:
			if (HIWORD(wParam) == BN_CLICKED) { Settings_t defaults; CopyFrameInterpolationSettings(*settings, defaults); SetFrameInterpolationDialogControls(hwnd, *settings); return TRUE; }
			break;
		case IDOK:
			ReadFrameInterpolationDialog(hwnd, *settings); EndDialog(hwnd, IDOK); return TRUE;
		case IDCANCEL:
			EndDialog(hwnd, IDCANCEL); return TRUE;
		}
		break;
	}
	return FALSE;
}

'''
          replace('Source/PropPage.cpp', 'void CopyMaxineSettings(Settings_t& dst, const Settings_t& src)\n', fruc_code + 'void CopyMaxineSettings(Settings_t& dst, const Settings_t& src)\n')
          show_method = r'''
bool CVRMainPPage::ShowFrameInterpolationSettings()
{
	Settings_t candidate = m_SetsPP;
	const INT_PTR result = DialogBoxParamW(g_hInst, MAKEINTRESOURCEW(IDD_FRAMEINTERPOLATION), m_hWnd, FrameInterpolationSettingsDlgProc, reinterpret_cast<LPARAM>(&candidate));
	if (result == -1) {
		MessageBoxW(L"The NVIDIA frame interpolation settings window could not be opened.", L"MPC Video Renderer", MB_OK | MB_ICONERROR);
		return false;
	}
	if (result != IDOK || FrameInterpolationSettingsEqual(candidate, m_SetsPP)) { return false; }
	CopyFrameInterpolationSettings(m_SetsPP, candidate);
	return true;
}

'''
          replace('Source/PropPage.cpp', 'HRESULT CVRMainPPage::OnConnect(IUnknown *pUnk)\n', show_method + 'HRESULT CVRMainPPage::OnConnect(IUnknown *pUnk)\n')
          replace('Source/PropPage.cpp', '\t\tGetDlgItem(IDC_BUTTON_MAXINE).EnableWindow(bEnable);\n', '\t\tGetDlgItem(IDC_BUTTON_MAXINE).EnableWindow(bEnable);\n\t\tGetDlgItem(IDC_BUTTON_FRAMEINTERPOLATION).EnableWindow(bEnable);\n')
          replace('Source/PropPage.cpp', '\t\tGetDlgItem(IDC_BUTTON_MAXINE).EnableWindow(FALSE);\n\t\tGetDlgItem(IDC_CHECK19).EnableWindow(FALSE);\n', '\t\tGetDlgItem(IDC_BUTTON_MAXINE).EnableWindow(FALSE);\n\t\tGetDlgItem(IDC_BUTTON_FRAMEINTERPOLATION).EnableWindow(FALSE);\n\t\tGetDlgItem(IDC_CHECK19).EnableWindow(FALSE);\n', 1)
          replace('Source/PropPage.cpp', '\tGetDlgItem(IDC_BUTTON_MAXINE).EnableWindow(FALSE);\n\tGetDlgItem(IDC_CHECK19).EnableWindow(FALSE);\n#endif\n', '\tGetDlgItem(IDC_BUTTON_MAXINE).EnableWindow(FALSE);\n\tGetDlgItem(IDC_BUTTON_FRAMEINTERPOLATION).EnableWindow(FALSE);\n\tGetDlgItem(IDC_CHECK19).EnableWindow(FALSE);\n#endif\n')
          replace('Source/PropPage.cpp', '''\t\t\tif (nID == IDC_BUTTON_MAXINE) {
\t\t\t\tif (ShowMaxineSettings()) {
\t\t\t\t\tSetDirty();
\t\t\t\t}
\t\t\t\treturn (LRESULT)1;
\t\t\t}
''', '''\t\t\tif (nID == IDC_BUTTON_MAXINE) {
\t\t\t\tif (ShowMaxineSettings()) { SetDirty(); }
\t\t\t\treturn (LRESULT)1;
\t\t\t}
\n\t\t\tif (nID == IDC_BUTTON_FRAMEINTERPOLATION) {
\t\t\t\tif (ShowFrameInterpolationSettings()) { SetDirty(); }
\t\t\t\treturn (LRESULT)1;
\t\t\t}
''')

          replace('Source/VideoRenderer.cpp', '#define OPT_MaxineAutoBitrate               L"MaxineAutoBitrateMbps"\n', '''#define OPT_MaxineAutoBitrate               L"MaxineAutoBitrateMbps"
#define OPT_FRUCMode                        L"FrameInterpolationMode"
#define OPT_FRUCSourceLimit                 L"FrameInterpolationSourceLimit"
#define OPT_FRUCMaxOutput                   L"FrameInterpolationMaxOutput"
#define OPT_FRUCGPU                         L"FrameInterpolationGPU"
#define OPT_FRUCFallback                    L"FrameInterpolationFallback"
''')
          read_block = r'''
		if (ERROR_SUCCESS == key.QueryDWORDValue(OPT_FRUCMode, dw)) { m_Sets.iFrameInterpolationMode = discard<int>(dw, FRUC_MODE_Disabled, 0, FRUC_MODE_COUNT - 1); }
		if (ERROR_SUCCESS == key.QueryDWORDValue(OPT_FRUCSourceLimit, dw)) { m_Sets.iFrameInterpolationSourceLimit = discard<int>(dw, FRUC_SOURCE_LIMIT_1080p, 0, FRUC_SOURCE_LIMIT_COUNT - 1); }
		if (ERROR_SUCCESS == key.QueryDWORDValue(OPT_FRUCMaxOutput, dw) && (dw == FRUC_MAX_OUTPUT_60 || dw == FRUC_MAX_OUTPUT_120 || dw == FRUC_MAX_OUTPUT_240)) { m_Sets.iFrameInterpolationMaxOutput = static_cast<int>(dw); }
		if (ERROR_SUCCESS == key.QueryDWORDValue(OPT_FRUCGPU, dw)) { if (dw == MAXDWORD) m_Sets.iFrameInterpolationGPU = FRUC_GPU_Auto; else if (dw <= 7) m_Sets.iFrameInterpolationGPU = static_cast<int>(dw); }
		if (ERROR_SUCCESS == key.QueryDWORDValue(OPT_FRUCFallback, dw)) { m_Sets.bFrameInterpolationFallback = !!dw; }
'''
          replace('Source/VideoRenderer.cpp', '\t\tif (!hasMaxineOperation && ERROR_SUCCESS == key.QueryDWORDValue(OPT_MaxineVideoSuperResolution, dw)) {\n', read_block + '\n\t\tif (!hasMaxineOperation && ERROR_SUCCESS == key.QueryDWORDValue(OPT_MaxineVideoSuperResolution, dw)) {\n')
          save_block = r'''
		key.SetDWORDValue(OPT_FRUCMode,                        m_Sets.iFrameInterpolationMode);
		key.SetDWORDValue(OPT_FRUCSourceLimit,                 m_Sets.iFrameInterpolationSourceLimit);
		key.SetDWORDValue(OPT_FRUCMaxOutput,                   m_Sets.iFrameInterpolationMaxOutput);
		key.SetDWORDValue(OPT_FRUCGPU,                         static_cast<DWORD>(m_Sets.iFrameInterpolationGPU));
		key.SetDWORDValue(OPT_FRUCFallback,                    m_Sets.bFrameInterpolationFallback);
'''
          replace('Source/VideoRenderer.cpp', '\t\tkey.SetDWORDValue(OPT_MaxineAutoBitrate,               m_Sets.iMaxineAutoBitrate);\n', '\t\tkey.SetDWORDValue(OPT_MaxineAutoBitrate,               m_Sets.iMaxineAutoBitrate);\n' + save_block)

          Path('docs').mkdir(exist_ok=True)
          Path('docs/NvidiaFrameInterpolation.md').write_text('''# NVIDIA frame interpolation

This draft introduces a dedicated frame-interpolation settings dialog and persistent configuration for a future NvFRUC-backed playback path.

The first engine milestone is exact 2x conversion: one generated midpoint frame between consecutive source frames. It must buffer one future frame, preserve timestamps, reset cleanly on seeks and media-type changes, and fall back to an original frame when interpolation quality is insufficient.

The NVIDIA Optical Flow SDK and NvFRUC runtime are governed by NVIDIA's SDK license. Do not commit or publish NVIDIA headers, sample source, import libraries, or runtime binaries until redistribution terms have been reviewed for compatibility with this GPL repository. The renderer integration should remain optional and dynamically load the external runtime.
''', encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-frame-interpolation-dialog.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Source docs
          git commit -m 'feat: add frame interpolation settings dialog [skip fruc dialog]'
          git push origin HEAD:feature/nvidia-frame-interpolation
