name: Repository cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Delete merged temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            feature/klite-maxine-updater \
            feature/maxine-settings-panel \
            feature/maxine-settings-panel-v2
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repository-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: remove temporary repository cleanup workflow"
          git push origin HEAD:master
