name: Apply dense NVOF integration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/apply-dense-synthesis-integration.ps1
      - .github/workflows/apply-dense-nvof.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate dense shaders and integrate production path
        shell: pwsh
        run: .\tools\native-nvof-probe\apply-dense-synthesis-integration.ps1
