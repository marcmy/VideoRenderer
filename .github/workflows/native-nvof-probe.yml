name: Native NVOF Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - tools/native-nvof-probe/**
      - .github/workflows/native-nvof-probe.yml
  pull_request:
    paths:
      - tools/native-nvof-probe/**
      - .github/workflows/native-nvof-probe.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare embedded probe sources
        shell: pwsh
        run: |
          function Make-SourceEmbeddable {
            param(
              [Parameter(Mandatory)] [string] $Path,
              [Parameter(Mandatory)] [string] $EntryMarker,
              [Parameter(Mandatory)] [string] $EmbeddedDefine,
              [Parameter(Mandatory)] [string] $RenamedEntry
            )

            $source = [IO.File]::ReadAllText($Path)
            if (-not $source.Contains($EntryMarker)) {
              throw "Could not find entry-point marker in $Path"
            }

            $replacement = @"
          #ifdef wmain
          #define $EmbeddedDefine 1
          #undef wmain
          #endif
          #define wmain $RenamedEntry
          "@
            $replacement = $replacement -replace '(?m)^          ', ''
            $source = $source.Replace($EntryMarker, $replacement.TrimEnd())

            $mainPattern = 'int wmain\(\)\r?\n\{'
            if (-not [regex]::IsMatch($source, $mainPattern)) {
              throw "Could not find main function in $Path"
            }
            $mainReplacement = @"
          #ifndef $EmbeddedDefine
          int wmain()
          {
          "@
            $mainReplacement = $mainReplacement -replace '(?m)^          ', ''
            $source = [regex]::Replace(
              $source,
              $mainPattern,
              $mainReplacement.TrimEnd(),
              1)
            $source += @"

          #endif
          #ifdef $EmbeddedDefine
          #undef $EmbeddedDefine
          #endif
          "@ -replace '(?m)^          ', ''
            [IO.File]::WriteAllText($Path, $source)
          }

          Make-SourceEmbeddable `
            -Path 'tools/native-nvof-probe/NativeNvofOcclusionTest.cpp' `
            -EntryMarker '#define wmain NativeNvofCpuMidpointReferenceMain' `
            -EmbeddedDefine 'NATIVE_NVOF_OCCLUSION_EMBEDDED' `
            -RenamedEntry 'NativeNvofCpuMidpointReferenceMain'

          $awarePath = 'tools/native-nvof-probe/NativeNvofOcclusionAwareTest.cpp'
          $awareSource = [IO.File]::ReadAllText($awarePath)
          $brokenShader = '    return alternative.score < current.score ? alternative : current;'
          $fixedShader = @'
              Candidate best = current;
              if (alternative.score < current.score) {
                  best = alternative;
              }
              return best;
          '@
          $fixedShader = $fixedShader -replace '(?m)^              ', '    '
          if (-not $awareSource.Contains($brokenShader)) {
            throw 'Could not find the occlusion-aware HLSL struct conditional.'
          }
          $awareSource = $awareSource.Replace(
            $brokenShader,
            $fixedShader.TrimEnd())
          [IO.File]::WriteAllText($awarePath, $awareSource)

          Make-SourceEmbeddable `
            -Path $awarePath `
            -EntryMarker '#define wmain NativeNvofOcclusionReferenceMain' `
            -EmbeddedDefine 'NATIVE_NVOF_OCCLUSION_AWARE_EMBEDDED' `
            -RenamedEntry 'NativeNvofOcclusionReferenceMain'

      - name: Build 64-bit probes
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo Visual Studio locator was not found.
            exit /b 1
          )

          set "VSROOT="
          for /f "usebackq delims=" %%I in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          if not defined VSROOT (
            echo A Visual Studio installation with the C++ x64 tools was not found.
            exit /b 1
          )

          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1

          if not exist build\native-nvof-probe mkdir build\native-nvof-probe

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Fo:build\native-nvof-probe\NativeNvofProbe.obj ^
            /Fe:build\native-nvof-probe\NativeNvofProbe.exe ^
            tools\native-nvof-probe\NativeNvofProbe.cpp ^
            /link d3d11.lib dxgi.lib
          if errorlevel 1 exit /b 1

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Itools\native-nvof-probe ^
            /Fo:build\native-nvof-probe\NativeNvofFlowTest.obj ^
            /Fe:build\native-nvof-probe\NativeNvofFlowTest.exe ^
            tools\native-nvof-probe\NativeNvofFlowTest.cpp ^
            /link d3d11.lib dxgi.lib
          if errorlevel 1 exit /b 1

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Itools\native-nvof-probe ^
            /Fo:build\native-nvof-probe\NativeNvofMidpointTest.obj ^
            /Fe:build\native-nvof-probe\NativeNvofMidpointTest.exe ^
            tools\native-nvof-probe\NativeNvofMidpointTest.cpp ^
            /link d3d11.lib dxgi.lib
          if errorlevel 1 exit /b 1

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Itools\native-nvof-probe ^
            /Fo:build\native-nvof-probe\NativeNvofGpuMidpointTest.obj ^
            /Fe:build\native-nvof-probe\NativeNvofGpuMidpointTest.exe ^
            tools\native-nvof-probe\NativeNvofGpuMidpointTest.cpp ^
            /link d3d11.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Itools\native-nvof-probe ^
            /Fo:build\native-nvof-probe\NativeNvofOcclusionTest.obj ^
            /Fe:build\native-nvof-probe\NativeNvofOcclusionTest.exe ^
            tools\native-nvof-probe\NativeNvofOcclusionTest.cpp ^
            /link d3d11.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Itools\native-nvof-probe ^
            /Fo:build\native-nvof-probe\NativeNvofOcclusionAwareTest.obj ^
            /Fe:build\native-nvof-probe\NativeNvofOcclusionAwareTest.exe ^
            tools\native-nvof-probe\NativeNvofOcclusionAwareTest.cpp ^
            /link d3d11.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1

          cl /nologo /std:c++20 /permissive- /Zc:__cplusplus /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE ^
            /Itools\native-nvof-probe ^
            /Fo:build\native-nvof-probe\NativeNvofBoundaryRefineTest.obj ^
            /Fe:build\native-nvof-probe\NativeNvofBoundaryRefineTest.exe ^
            tools\native-nvof-probe\NativeNvofBoundaryRefineTest.cpp ^
            /link d3d11.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1

          copy /y tools\native-nvof-probe\README.md build\native-nvof-probe\README.md >nul

      - name: Validate embedded HLSL
        shell: pwsh
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            throw 'fxc.exe was not found in the Windows SDK.'
          }

          $specs = @(
            @{
              Path = 'tools/native-nvof-probe/NativeNvofOcclusionAwareTest.cpp'
              Name = 'OcclusionAwareComputeShader'
              Output = 'NativeNvofOcclusionAware'
            },
            @{
              Path = 'tools/native-nvof-probe/NativeNvofBoundaryRefinePart1.inc'
              Name = 'BoundarySearchComputeShader'
              Output = 'NativeNvofBoundarySearch'
            },
            @{
              Path = 'tools/native-nvof-probe/NativeNvofBoundaryRefinePart2.inc'
              Name = 'BoundaryRepairComputeShader'
              Output = 'NativeNvofBoundaryRepair'
            }
          )

          foreach ($spec in $specs) {
            $source = [IO.File]::ReadAllText($spec.Path)
            $escapedName = [regex]::Escape($spec.Name)
            $pattern = "constexpr char $escapedName\[\] = R`"hlsl\((?<shader>[\s\S]*?)\)hlsl`";"
            $match = [regex]::Match($source, $pattern)
            if (-not $match.Success) {
              throw "Could not extract $($spec.Name) from $($spec.Path)"
            }

            $shaderPath = "build/native-nvof-probe/$($spec.Output).hlsl"
            $outputBytecode = "build/native-nvof-probe/$($spec.Output).cso"
            [IO.File]::WriteAllText($shaderPath, $match.Groups['shader'].Value)
            & $fxc.FullName /nologo /T cs_5_0 /E main /WX /Fo $outputBytecode $shaderPath
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload probes
        uses: actions/upload-artifact@v4
        with:
          name: Native-NVOF-Probe
          path: build/native-nvof-probe
          if-no-files-found: error
          retention-days: 14
