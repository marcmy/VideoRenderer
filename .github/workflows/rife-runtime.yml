name: Build RIFE TensorRT runtime

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - feature/rife-tensorrt-interpolation
    paths:
      - .github/workflows/rife-runtime.yml
      - tools/RifeTensorRTRuntime/**
      - tools/RifeRuntimeInstaller/**
      - Source/RifeRuntimeApi.h

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CUDA_VERSION: 12.9.1
      CUDA_COMPILER_VERSION: 12.9.86
      CUDA_RUNTIME_VERSION: 12.9.79
      TENSORRT_VERSION: 11.2.1.2
      NVIDIA_DOWNLOAD_CACHE: ${{ github.workspace }}\_rife-download-cache
      CUDA_ROOT: ${{ github.workspace }}\_rife-deps\cuda-12.9
      TENSORRT_ARCHIVE: ${{ github.workspace }}\_rife-download-cache\TensorRT-11.2.1.2.zip
      TENSORRT_EXPECTED_SHA256: 8653df0b9a57ea5fd349e12d20243f6131f02052ef8041e756366e5779348c16
      TENSORRT_EXTRACT: ${{ github.workspace }}\_rife-deps\tensorrt
      BUILD_DIR: ${{ github.workspace }}\_rife-runtime-build
      PACKAGE_DIR: ${{ github.workspace }}\_rife-runtime-package
      BUNDLE_DIR: ${{ github.workspace }}\_rife-runtime-bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pinned NVIDIA SDK archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\_rife-download-cache
          key: rife-nvidia-sdk-windows-cuda-12.9.1-tensorrt-11.2.1.2-v1

      - name: Enter Visual Studio x64 developer shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ toolchain was not found' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          "VS_INSTALL=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VSCMD_ARG_TGT_ARCH=x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cl 2>&1 | Select-Object -First 3
          cmake --version
          ninja --version

      - name: Download pinned CUDA 12.9.1 build components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:CUDA_ROOT | Out-Null
          New-Item -ItemType Directory -Force -Path $env:NVIDIA_DOWNLOAD_CACHE | Out-Null

          function Add-CudaArchive([string]$name, [string]$relativePath, [string]$sha256) {
              $zip = Join-Path $env:NVIDIA_DOWNLOAD_CACHE "$name.zip"
              $extract = Join-Path $env:RUNNER_TEMP "$name-extract"
              $url = "https://developer.download.nvidia.com/compute/cuda/redist/$relativePath"
              if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
                  Write-Host "Downloading $url"
                  & curl.exe --fail --location --retry 3 --output $zip $url
                  if ($LASTEXITCODE -ne 0) { throw "curl failed for $name" }
              }
              else {
                  Write-Host "Using cached $name archive"
              }

              $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
              if ($actual -ne $sha256) {
                  Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
                  throw "$name SHA-256 mismatch: $actual"
              }

              Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
              Expand-Archive -Path $zip -DestinationPath $extract
              $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
              if (-not $root) { throw "$name archive did not contain a root directory" }
              Copy-Item -Path (Join-Path $root.FullName '*') -Destination $env:CUDA_ROOT -Recurse -Force
          }

          Add-CudaArchive 'cuda_nvcc' `
            'cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.9.86-archive.zip' `
            '227b109663b5e57d2718bcabb24a4ba0d9d4e52d958e327dc476f7c28691be85'
          Add-CudaArchive 'cuda_cudart' `
            'cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.9.79-archive.zip' `
            '179e9c43b0735ffe67207b3da556eb5a0c50f3047961882b7657d3b822d34ef8'
          Add-CudaArchive 'cuda_cccl' `
            'cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.9.27-archive.zip' `
            '17aaa7c6b8f94a417d8f3261780b7e34b9cbdfab7513bce86768623b06aa28b5'

          $nvcc = Join-Path $env:CUDA_ROOT 'bin\nvcc.exe'
          if (-not (Test-Path $nvcc)) { throw "nvcc not found at $nvcc" }
          & $nvcc --version
          "CUDAToolkit_ROOT=$env:CUDA_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:CUDA_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Download TensorRT 11.2.1.2 for CUDA 12.9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:NVIDIA_DOWNLOAD_CACHE | Out-Null
          $url = 'https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/11.2.1/zip/TensorRT-Enterprise-11.2.1.2-Windows-amd64-cuda-12.9-Release-external.zip'
          if (-not (Test-Path -LiteralPath $env:TENSORRT_ARCHIVE -PathType Leaf)) {
              & curl.exe --fail --location --retry 3 --output $env:TENSORRT_ARCHIVE $url
              if ($LASTEXITCODE -ne 0) { throw 'TensorRT download failed' }
          }
          else {
              Write-Host 'Using cached TensorRT archive'
          }

          $actual = (Get-FileHash -Algorithm SHA256 $env:TENSORRT_ARCHIVE).Hash.ToLowerInvariant()
          if ($actual -ne $env:TENSORRT_EXPECTED_SHA256) {
              Remove-Item -LiteralPath $env:TENSORRT_ARCHIVE -Force -ErrorAction SilentlyContinue
              throw "TensorRT SHA-256 mismatch: $actual"
          }

          Remove-Item -Recurse -Force $env:TENSORRT_EXTRACT -ErrorAction SilentlyContinue
          Expand-Archive -Path $env:TENSORRT_ARCHIVE -DestinationPath $env:TENSORRT_EXTRACT
          $root = Get-ChildItem -Path $env:TENSORRT_EXTRACT -Directory | Where-Object Name -Like 'TensorRT-*' | Select-Object -First 1
          if (-not $root) { throw 'TensorRT root directory was not found after extraction' }
          "TENSORRT_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TENSORRT_DOWNLOAD_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem (Join-Path $root.FullName 'lib') -Filter 'nvinfer*.dll' | Select-Object -First 8 -ExpandProperty Name

      - name: Configure and build runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = $env:VS_INSTALL
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          cmake -S tools/RifeTensorRTRuntime -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CUDA_COMPILER=$env:CUDA_ROOT\bin\nvcc.exe" `
            "-DCUDAToolkit_ROOT=$env:CUDA_ROOT" `
            "-DTENSORRT_ROOT=$env:TENSORRT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

          cmake --build $env:BUILD_DIR --parallel
          if ($LASTEXITCODE -ne 0) { throw 'RIFE runtime build failed' }

      - name: Validate and package runtime bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path $env:BUILD_DIR -Recurse -Filter 'MPCVRRifeRuntime64.dll' | Select-Object -First 1
          if (-not $dll) { throw 'MPCVRRifeRuntime64.dll was not produced' }

          $vs = $env:VS_INSTALL
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $depends = (& dumpbin /dependents $dll.FullName 2>&1 | Out-String)
          foreach ($requiredDependency in @('cudart64_12.dll', 'nvinfer_11.dll', 'nvonnxparser_11.dll')) {
              if ($depends -notmatch ('(?im)^\s*' + [regex]::Escape($requiredDependency) + '\s*$')) {
                  throw "Built runtime is missing expected dependency: $requiredDependency"
              }
          }
          if ($depends -match '(?im)^\s*nvinfer_plugin_11\.dll\s*$') {
              throw 'MPCVRRifeRuntime64.dll unexpectedly depends on nvinfer_plugin_11.dll; update the audited common-runtime contract before packaging it.'
          }

          Remove-Item -LiteralPath $env:PACKAGE_DIR -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:BUNDLE_DIR -Recurse -Force -ErrorAction SilentlyContinue
          $common = Join-Path $env:PACKAGE_DIR 'common'
          $architectures = Join-Path $env:PACKAGE_DIR 'architecture'
          New-Item -ItemType Directory -Force -Path $common | Out-Null
          New-Item -ItemType Directory -Force -Path $architectures | Out-Null
          New-Item -ItemType Directory -Force -Path $env:BUNDLE_DIR | Out-Null

          function Resolve-RequiredFile([string]$Root, [string]$Name) {
              $matches = @(Get-ChildItem -LiteralPath $Root -Recurse -File -Filter $Name)
              if ($matches.Count -eq 0) { throw "Pinned NVIDIA package is missing required file '$Name' under '$Root'" }
              if ($matches.Count -gt 1) { throw "Pinned NVIDIA package contains multiple '$Name' files under '$Root'; packaging is ambiguous" }
              $matches[0].FullName
          }

          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $common 'MPCVRRifeRuntime64.dll')
          Copy-Item -LiteralPath (Resolve-RequiredFile $env:CUDA_ROOT 'cudart64_12.dll') -Destination $common
          foreach ($name in @('nvinfer_11.dll', 'nvonnxparser_11.dll', 'nvinfer_builder_resource_ptx_11.dll')) {
              Copy-Item -LiteralPath (Resolve-RequiredFile $env:TENSORRT_ROOT $name) -Destination $common
          }

          $buildInfo = @"
          MPCVR RIFE TensorRT runtime build
          Runtime ABI: 1
          TensorRT: $env:TENSORRT_VERSION
          TensorRT archive SHA-256: $env:TENSORRT_DOWNLOAD_SHA256
          CUDA toolkit: $env:CUDA_VERSION
          CUDA compiler: $env:CUDA_COMPILER_VERSION
          CUDA runtime: $env:CUDA_RUNTIME_VERSION
          Supported compute capabilities: 7.5 (sm75), 8.6 (sm86), 8.9 (sm89), 12.0 (sm120)
          TensorRT engines: generated locally; no prebuilt .plan files are distributed.
          "@
          $buildInfo | Set-Content -Encoding utf8 (Join-Path $common 'BUILD-INFO.txt')
          $buildInfo | Set-Content -Encoding utf8 (Join-Path $env:BUNDLE_DIR 'BUILD-INFO.txt')
          $depends | Set-Content -Encoding utf8 (Join-Path $env:BUNDLE_DIR 'DEPENDENCIES.txt')

          $archEntries = @(
              [pscustomobject]@{ computeCapability = '7.5'; key = 'sm75'; builderResource = 'nvinfer_builder_resource_sm75_11.dll' },
              [pscustomobject]@{ computeCapability = '8.6'; key = 'sm86'; builderResource = 'nvinfer_builder_resource_sm86_11.dll' },
              [pscustomobject]@{ computeCapability = '8.9'; key = 'sm89'; builderResource = 'nvinfer_builder_resource_sm89_11.dll' },
              [pscustomobject]@{ computeCapability = '12.0'; key = 'sm120'; builderResource = 'nvinfer_builder_resource_sm120_11.dll' }
          )
          foreach ($entry in $archEntries) {
              $destination = Join-Path $architectures $entry.key
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              Copy-Item -LiteralPath (Resolve-RequiredFile $env:TENSORRT_ROOT $entry.builderResource) -Destination $destination
          }

          [pscustomobject]@{
              schemaVersion = 1
              cudaVersion = $env:CUDA_VERSION
              cudaRuntimeVersion = $env:CUDA_RUNTIME_VERSION
              tensorRtVersion = $env:TENSORRT_VERSION
              runtimeAbi = 1
              architectures = $archEntries
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $env:BUNDLE_DIR 'runtime-manifest.json')

          Compress-Archive -Path (Join-Path $common '*') -DestinationPath (Join-Path $env:BUNDLE_DIR 'MPCVR-RIFE-Common.zip')
          foreach ($entry in $archEntries) {
              $source = Join-Path $architectures $entry.key
              Compress-Archive -Path (Join-Path $source '*') -DestinationPath (Join-Path $env:BUNDLE_DIR "MPCVR-RIFE-$($entry.key).zip")
          }

          $archives = @('MPCVR-RIFE-Common.zip', 'MPCVR-RIFE-sm75.zip', 'MPCVR-RIFE-sm86.zip', 'MPCVR-RIFE-sm89.zip', 'MPCVR-RIFE-sm120.zip')
          @(
              foreach ($archive in $archives) {
                  $hash = (Get-FileHash -LiteralPath (Join-Path $env:BUNDLE_DIR $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $archive"
              }
          ) | Set-Content -Encoding ascii (Join-Path $env:BUNDLE_DIR 'SHA256SUMS.txt')

          foreach ($sdk in @(
              [pscustomobject]@{ Prefix = 'TensorRT'; Root = $env:TENSORRT_ROOT },
              [pscustomobject]@{ Prefix = 'CUDA'; Root = $env:CUDA_ROOT }
          )) {
              $documents = @(Get-ChildItem -LiteralPath $sdk.Root -File | Where-Object {
                  $_.Name -match '(?i)^(license|notice|third.?party)'
              })
              foreach ($document in $documents) {
                  $targetName = '{0}-{1}' -f $sdk.Prefix, $document.Name
                  Copy-Item -LiteralPath $document.FullName -Destination (Join-Path $env:BUNDLE_DIR $targetName)
              }
          }

          Get-Content (Join-Path $env:BUNDLE_DIR 'SHA256SUMS.txt')
          Get-Content (Join-Path $env:BUNDLE_DIR 'DEPENDENCIES.txt')

      - name: Validate assembled runtime bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            tools/RifeRuntimeInstaller/Test-RifeRuntimePackage.ps1 -BundleRoot $env:BUNDLE_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh.exe -NoLogo -NoProfile -File `
            tools/RifeRuntimeInstaller/Test-RifeRuntimePackage.ps1 -BundleRoot $env:BUNDLE_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpcvr-rife-runtime-bundle
          path: ${{ github.workspace }}\_rife-runtime-bundle\
          if-no-files-found: error
          compression-level: 0
