name: One-time real-frame NVOF capture patch

on:
  push:
    branches:
      - feature/native-nvof-interpolation
    paths:
      - .github/workflows/one-time-nvof-real-capture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch native NVOF backend
        run: python tools/native-nvof-probe/PatchNativeNvofRealCapture.py

      - name: Commit capture wiring and remove temporary patch files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-time-nvof-real-capture-patch.yml
          git rm -- tools/native-nvof-probe/PatchNativeNvofRealCapture.py
          git add -- Source/NvidiaOpticalFlowNative.cpp
          git commit -m 'Add real-frame NVOF capture diagnostics'
          git push origin HEAD:feature/native-nvof-interpolation
