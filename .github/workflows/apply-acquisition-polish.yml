name: Apply acquisition polish

on:
  push:
    branches:
      - feature/one-click-installer-calibration
    paths:
      - '.github/workflows/apply-acquisition-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/one-click-installer-calibration
          fetch-depth: 0

      - name: Apply patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\nvoffruc\Apply-AcquisitionPolishPatch.ps1

      - name: Validate touched PowerShell files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\tools\nvoffruc\MpcvrNvOffruc.Acquisition.psm1',
            '.\tools\UnifiedSetup\Start-MpcvrUnifiedSetup.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw (($errors | ForEach-Object { $_.Message }) -join [Environment]::NewLine)
            }
          }

      - name: Commit applied files and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/nvoffruc/Apply-AcquisitionPolishPatch.ps1
          git rm .github/workflows/apply-acquisition-polish.yml
          git add \
            tools/nvoffruc/MpcvrNvOffruc.Acquisition.psm1 \
            tools/UnifiedSetup/Start-MpcvrUnifiedSetup.ps1 \
            tools/UnifiedSetup/README.md
          git commit -m 'fix: harden assisted SDK detection and GUI guidance'
          git push origin HEAD:feature/one-click-installer-calibration
