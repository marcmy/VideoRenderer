name: Apply GUI ASCII label cleanup

on:
  push:
    branches:
      - feature/one-click-installer-calibration
    paths:
      - '.github/workflows/apply-gui-ascii-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/one-click-installer-calibration
          fetch-depth: 0

      - name: Apply ASCII label cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\UnifiedSetup\Fix-GuiAsciiLabels.ps1

      - name: Validate GUI in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\UnifiedSetup\Start-MpcvrUnifiedSetup.ps1 -ValidateOnly

      - name: Validate GUI in PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\UnifiedSetup\Start-MpcvrUnifiedSetup.ps1 -ValidateOnly

      - name: Commit cleanup and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/UnifiedSetup/Fix-GuiAsciiLabels.ps1
          git rm .github/workflows/apply-gui-ascii-labels.yml
          git add tools/UnifiedSetup/Start-MpcvrUnifiedSetup.ps1
          git commit -m 'fix: clean unified setup GUI text encoding'
          git push origin HEAD:feature/one-click-installer-calibration
