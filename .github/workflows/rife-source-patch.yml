name: Apply RIFE TensorRT 11 source compatibility patch

on:
  push:
    branches:
      - feature/rife-tensorrt-interpolation
    paths:
      - .github/workflows/rife-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/rife-tensorrt-interpolation
          fetch-depth: 0

      - name: Apply surgical TensorRT 11 compatibility edits
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/RifeTensorRTRuntime/RifeTensorRTRuntime.cpp')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '#if NV_TENSORRT_MAJOR == 10\n',
                  '#if NV_TENSORRT_MAJOR >= 10\n',
              ),
              (
                  '        TrtPtr<nvinfer1::IOptimizationProfile> profile(builder->createOptimizationProfile());\n',
                  '        nvinfer1::IOptimizationProfile* profile = builder->createOptimizationProfile();\n',
              ),
              (
                  '        if (config->addOptimizationProfile(profile.get()) < 0) return false;\n        profile.release();\n',
                  '        if (config->addOptimizationProfile(profile) < 0) return false;\n',
              ),
              (
                  '        if (DataTypeBytes(inputType) == 0 || DataTypeBytes(outputType) == 0) return false;\n',
                  '        const auto supportedType = [](nvinfer1::DataType type) {\n'
                  '            return type == nvinfer1::DataType::kFLOAT || type == nvinfer1::DataType::kHALF;\n'
                  '        };\n'
                  '        if (!supportedType(inputType) || !supportedType(outputType)) return false;\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/RifeTensorRTRuntime/RifeTensorRTRuntime.cpp
          git diff --cached --check
          git commit -m "fix: update RIFE runtime for TensorRT 11 ownership"
          git push origin HEAD:feature/rife-tensorrt-interpolation
