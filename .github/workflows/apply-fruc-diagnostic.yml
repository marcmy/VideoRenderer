name: Apply FRUC diagnostic instrumentation

on:
  push:
    branches: [diag/nvoffruc-seek-freeze-fc40]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diag/nvoffruc-seek-freeze-fc40
          fetch-depth: 0
      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fruc-diagnostic.patch.part* | base64 -d | gzip -d > /tmp/fruc-diagnostic.patch
          echo '4e9f36f89378b47ec7c0ef078db7643fe469b51125107be11771dac10586b3a6  /tmp/fruc-diagnostic.patch' | sha256sum -c -
          git apply --check /tmp/fruc-diagnostic.patch
          git apply /tmp/fruc-diagnostic.patch
          rm -f .github/fruc-diagnostic.patch.part*
          rm -f .github/workflows/apply-fruc-diagnostic.yml
          rm -f .github/workflows/export-fruc-diag-fc40.yml
      - name: Commit instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'diagnostics: trace NvOFFRUC seek freeze'
          git push origin HEAD:diag/nvoffruc-seek-freeze-fc40
