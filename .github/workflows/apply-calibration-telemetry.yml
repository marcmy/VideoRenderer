name: Apply calibration telemetry source patch

on:
  push:
    branches: [feature/one-click-installer-calibration]
    paths:
      - '.github/apply-calibration-telemetry.py'
      - '.github/workflows/apply-calibration-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/one-click-installer-calibration
          fetch-depth: 0
      - name: Apply verified source edits
        run: python .github/apply-calibration-telemetry.py
      - name: Commit source changes and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply-calibration-telemetry.py
          rm -f .github/workflows/apply-calibration-telemetry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: publish renderer calibration telemetry'
          git push origin HEAD:feature/one-click-installer-calibration
