# Install as .github/workflows/publish.yml in marcmy/VideoRenderer-Dependencies.
# This repository's own GITHUB_TOKEN publishes here; no cross-repository PAT.
# approve-workflow renders the literal source/recipe grant before committing it.
name: Publish immutable application dependencies
on:
  workflow_dispatch:
    inputs:
      component:
        description: Changed dependency only
        type: choice
        options: [rife-runtime, rife-models, maxine]
        required: true
      source_ref:
        description: Exact source SHA already approved in this workflow
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: dependency-publishing-${{ inputs.component }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'marcmy/VideoRenderer-Dependencies' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/dependency-source-__APPROVED_SOURCE_REF__-'))
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marcmy/VideoRenderer
          ref: __APPROVED_SOURCE_REF__
          fetch-depth: 0
          persist-credentials: false
      - name: Approve requested source before planning or building
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APPROVED_SOURCE_REF: __APPROVED_SOURCE_REF__
        run: python tools/Dev/dependencies.py approve-source --source-ref "$SOURCE_REF" --approved-ref "$APPROVED_SOURCE_REF"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: |
          python tools/Dev/dependencies.py plan --directory plan
          python -c 'import json,os; p=json.load(open("plan/plan.json")); needed=p["components"][os.environ["COMPONENT"]]["manifest"] is None; open(os.environ["GITHUB_OUTPUT"],"a").write("needed="+str(needed).lower()+"\n")'
  runtime:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && inputs.component == 'rife-runtime'
    uses: marcmy/VideoRenderer/.github/workflows/rife-runtime.yml@__APPROVED_SOURCE_REF__
    with:
      source_repository: marcmy/VideoRenderer
      source_ref: __APPROVED_SOURCE_REF__
  models:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && inputs.component == 'rife-models'
    uses: marcmy/VideoRenderer/.github/workflows/rife-model.yml@__APPROVED_SOURCE_REF__
    with:
      source_repository: marcmy/VideoRenderer
      source_ref: __APPROVED_SOURCE_REF__
  maxine:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && inputs.component == 'maxine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marcmy/VideoRenderer
          ref: __APPROVED_SOURCE_REF__
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: |
          python tools/MaxineRuntimeInstaller/Build-MPCVRMaxineRuntime.py --output component
          curl --fail --location https://developer.nvidia.com/downloads/maxine-sdk-license --output component/Maxine-SDK-License.pdf
          echo '3749955ea638199e317d87261512dc9baa6d4d4be424f21a1f9b609e54154703  component/Maxine-SDK-License.pdf' | sha256sum --check --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mpcvr-maxine-runtime-bundle
          path: |
            component/MPCVR-Maxine-Runtime.zip
            component/Maxine-SDK-License.pdf
          compression-level: 0
  publish:
    needs: [plan, runtime, models, maxine]
    if: always() && needs.plan.outputs.needed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marcmy/VideoRenderer
          ref: __APPROVED_SOURCE_REF__
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
          path: component
      - env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: |
          python tools/Dev/dependencies.py prepare-component --component "$COMPONENT" --directory component
          python tools/Dev/dependencies.py publish-seed --component "$COMPONENT" --directory component
